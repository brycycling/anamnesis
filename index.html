<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Anamnesis Intake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinician workspace = sidebar + working column; patient intake = single calm reading column */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#16211F; --muted:#56635F; --line:#D3DCD9;
  --accent:#1E5C57; --accent-ink:#FFFFFF; --accent-soft:#DCEAE7;
  --crit:#B42318; --crit-soft:#FCE8E5; --warn:#8F5500; --warn-soft:#FAEFD8; --ok:#2E6B3B; --ok-soft:#E0EFE3;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201F; --sunk:#1C2927; --ink:#E2EAE7; --muted:#9BABA6; --line:#2B3A37;
  --accent:#6FB6AD; --accent-ink:#0A1312; --accent-soft:#1E3633;
  --crit:#FF8D84; --crit-soft:#3B1D1A; --warn:#F0B562; --warn-soft:#382B15; --ok:#8CC79B; --ok-soft:#1B3021; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201F; --sunk:#1C2927; --ink:#E2EAE7; --muted:#9BABA6; --line:#2B3A37;
  --accent:#6FB6AD; --accent-ink:#0A1312; --accent-soft:#1E3633;
  --crit:#FF8D84; --crit-soft:#3B1D1A; --warn:#F0B562; --warn-soft:#382B15; --ok:#8CC79B; --ok-soft:#1B3021; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-size:.8rem}
.label{font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.82rem}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:650;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px 18px}
.brand b{font-family:var(--f-doc);font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:.72rem;color:var(--muted)}
.nav{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:550}
.nav:hover{background:var(--sunk)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.side .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
.main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));gap:4px;flex-wrap:wrap}
  .brand{padding:0 8px 0 0}
  .side .foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.list{width:100%;border-collapse:collapse;min-width:620px}
table.list th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:10px 14px;border-bottom:1px solid var(--line)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--sunk)}
table.list tr.urgent td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.empty{padding:36px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
fieldset.field{border:0;margin:0;padding:0}
.field > label,.field > legend,.field > .flabel{font-size:.92rem;font-weight:600;padding:0}
.field > legend{margin-bottom:6px}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;max-width:100%}
input[type=number]{max-width:140px}
input[type=date]{max-width:220px}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr 1fr}}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--bg);cursor:pointer;font-size:.92rem;font-weight:400}
.opt input{accent-color:var(--accent);margin:0;width:16px;height:16px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rows{display:flex;flex-direction:column;gap:10px}
.rowcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;align-items:end;background:var(--bg)}
.rowcard .rc{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.rowcard input,.rowcard select{color:var(--ink);padding:7px 9px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;font-weight:400}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.prefill{font-size:.82rem;border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:0 6px 6px 0}

.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mod{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center}
.mod i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mod.done i{background:var(--ok)} .mod.deferred i{background:var(--warn)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.timeline li{display:flex;gap:10px;align-items:baseline}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;transform:translateY(-1px)}
.timeline li span:last-child{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:.75rem;white-space:nowrap}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.doctext{white-space:pre-wrap;font-family:var(--f-doc);font-size:.92rem;background:var(--sunk);border-radius:8px;padding:12px;max-height:260px;overflow:auto}
.resp dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 18px;margin:0;font-size:.9rem}
.resp dt{color:var(--muted)}
.resp dd{margin:0;white-space:pre-wrap}
@media (max-width:640px){.resp dl{grid-template-columns:1fr;gap:2px}.resp dd{margin-bottom:8px}}
.tx{display:flex;flex-direction:column;gap:2px}
.tx .t{display:grid;grid-template-columns:44px 74px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:8px;font-size:.9rem}
.tx .t.pt{background:var(--sunk)}

.notewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){.notewrap{grid-template-columns:1fr}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px;font-family:var(--f-doc);font-size:1rem;line-height:1.6;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.note{padding:18px 16px}}
.note h3{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.note .sec{display:flex;flex-direction:column;gap:6px}
.stmt{display:block}
.stmt .tx-edit{outline:none;border-radius:4px;padding:0 2px}
.stmt .tx-edit:hover{background:var(--sunk)}
.stmt .tx-edit:focus{background:var(--accent-soft)}
.stmt.unv .tx-edit{text-decoration:underline wavy var(--crit);text-underline-offset:4px}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.68rem;line-height:1;padding:3px 5px;margin-left:4px;border-radius:4px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;vertical-align:2px}
.chip.bad{background:var(--crit-soft);color:var(--crit)}
.chip.on{outline:2px solid var(--accent)}
.srcpanel{position:sticky;top:16px}
.srcq{font-family:var(--f-doc);font-size:.95rem;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.unres li{margin-bottom:6px}
.letter{font-family:var(--f-doc);font-size:.98rem;line-height:1.6;min-height:340px}

.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}

/* Patient side */
.pt-page{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.pt-col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pt-top b{font-family:var(--f-doc);font-size:1.15rem;font-weight:600}
.pt-hero h1{font-family:var(--f-doc);font-weight:600;font-size:2rem;letter-spacing:-.01em}
.pt-hero p{font-size:1.05rem;color:var(--muted);margin-top:8px;max-width:60ch}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.feat{grid-template-columns:1fr}}
.feat .card{gap:4px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs i.cur{background:var(--accent);opacity:.45}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.qcard{padding:16px}}
.qitem{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.qopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:560px){.qopts{grid-template-columns:1fr 1fr}}
.qopts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;font-size:.85rem;text-align:left}
.qopts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qopts.yn{grid-template-columns:repeat(2,minmax(0,140px))}
.crisis{border:2px solid var(--crit);background:var(--crit-soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.crisis h2{color:var(--crit)}
.crisis .num{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.proto{font-size:.82rem;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted)}
.revrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Validated questionnaires ---------- */
const OPTS4 = ['Not at all','Several days','More than half the days','Nearly every day'];
const DIFF = ['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'];
const PHQ9 = {id:'phq9', name:'PHQ-9', stem:'Over the last 2 weeks, how often have you been bothered by any of the following problems?', items:[
 'Little interest or pleasure in doing things',
 'Feeling down, depressed, or hopeless',
 'Trouble falling or staying asleep, or sleeping too much',
 'Feeling tired or having little energy',
 'Poor appetite or overeating',
 'Feeling bad about yourself — or that you are a failure or have let yourself or your family down',
 'Trouble concentrating on things, such as reading the newspaper or watching television',
 'Moving or speaking so slowly that other people could have noticed? Or the opposite — being so fidgety or restless that you have been moving around a lot more than usual',
 'Thoughts that you would be better off dead or of hurting yourself in some way'],
 diff:'If you checked off any problems, how difficult have these problems made it for you to do your work, take care of things at home, or get along with other people?',
 bands:[[0,'Minimal'],[5,'Mild'],[10,'Moderate'],[15,'Moderately severe'],[20,'Severe']], max:27};
const GAD7 = {id:'gad7', name:'GAD-7', stem:'Over the last 2 weeks, how often have you been bothered by the following problems?', items:[
 'Feeling nervous, anxious, or on edge',
 'Not being able to stop or control worrying',
 'Worrying too much about different things',
 'Trouble relaxing',
 'Being so restless that it is hard to sit still',
 'Becoming easily annoyed or irritable',
 'Feeling afraid, as if something awful might happen'],
 diff:'If you checked any problems, how difficult have they made it for you to do your work, take care of things at home, or get along with other people?',
 bands:[[0,'Minimal'],[5,'Mild'],[10,'Moderate'],[15,'Severe']], max:21};
const QS = {phq9:PHQ9, gad7:GAD7};
const band = (q,t)=>{let b=q.bands[0][1]; for(const [min,l] of q.bands) if(t>=min) b=l; return b;};
/* C-SSRS Screen Version (The Columbia Lighthouse Project). Item wording as published; n:7 is the follow-up to item 6. */
const CSSRS = {name:'C-SSRS screener', stem:'These questions ask about thoughts of death and suicide. Many people who feel low have thoughts like these. Your answers help your psychiatrist understand how you are doing.', items:[
 {n:1, when:'In the past month', q:'Have you wished you were dead or wished you could go to sleep and not wake up?'},
 {n:2, q:'Have you actually had any thoughts of killing yourself?'},
 {n:3, q:'Have you been thinking about how you might do this?', hint:'For example, "I thought about taking an overdose but I never made a specific plan as to when, where or how I would actually do it, and I would never go through with it."', if:a=>a[2]},
 {n:4, q:'Have you had these thoughts and had some intention of acting on them?', hint:'As opposed to "I have the thoughts but I definitely will not do anything about them."', if:a=>a[2]},
 {n:5, q:'Have you started to work out or worked out the details of how to kill yourself? Do you intend to carry out this plan?', if:a=>a[2]},
 {n:6, when:'In your lifetime', q:'Have you ever done anything, started to do anything, or prepared to do anything to end your life?', hint:"For example: collected pills, obtained a gun, gave away valuables, wrote a will or suicide note, took out pills but didn't swallow any, held a gun but changed your mind or it was grabbed from your hand, went to the roof but didn't jump; or actually took pills, tried to shoot yourself, cut yourself, tried to hang yourself."},
 {n:7, q:'Was this within the past 3 months?', if:a=>a[6]}
]};
const cssrsVisible = a => CSSRS.items.filter(i=>!i.if || i.if(a));
function cssrsLevel(a){ if(a[4] || a[5] || (a[6] && a[7])) return 'high'; if(a[3] || (a[6] && !a[7])) return 'moderate'; if(a[1] || a[2]) return 'low'; return 'none'; }
const CSSRS_LABEL = {none:'No suicidal ideation or behaviour reported', low:'Low risk: ideation without method, intent or plan', moderate:'Moderate risk', high:'High risk'};
const cssrsSummary = r => cssrsVisible(r.a).map(i=>`${i.n===7?'Q6 in past 3 months':'Q'+i.n}: ${r.a[i.n]?'Yes':'No'}`).join('; ');
const SCREENS = ['phq9','gad7','cssrs'];
const nextScreen = it => SCREENS.find(k=>!it.q?.[k] && !(it.qSkipped||[]).includes(k));

/* AUDIT-C (WHO AUDIT items 1-3) */
const AUDIT1 = ['Never','Monthly or less','2 to 4 times a month','2 to 3 times a week','4 or more times a week'];
const AUDIT2 = ['1 or 2','3 or 4','5 or 6','7 to 9','10 or more'];
const AUDIT3 = ['Never','Less than monthly','Monthly','Weekly','Daily or almost daily'];
function auditC(s){ if(!s || !s.a1) return null; const a=AUDIT1.indexOf(s.a1); if(a<=0) return a===0?0:null; return a + Math.max(0,AUDIT2.indexOf(s.a2)) + Math.max(0,AUDIT3.indexOf(s.a3)); }

/* ---------- Intake form ---------- */
const YN = 'yesno';
const FORM = [
 {id:'about', name:'About you', short:'About', fields:[
  {id:'prefName', label:'Preferred name', type:'text'},
  {id:'pronouns', label:'Pronouns', type:'text', hint:'For example she/her, he/him, they/them'},
  {id:'dob', label:'Date of birth', type:'date'},
  {id:'relationship', label:'Relationship status', type:'select', options:['Single','Dating','In a long-term relationship','Married or common-law','Separated','Divorced','Widowed','Prefer not to say']},
  {id:'livesWith', label:'Who do you live with?', type:'text'},
  {id:'housing', label:'Housing', type:'select', options:['Own home','Renting','With family or friends','Supported housing','No stable housing','Other']},
  {id:'children', label:'Children or other dependants', type:'text', hint:'Ages, and whether they live with you'}
 ]},
 {id:'concerns', name:'What brings you here', short:'Concerns', fields:[
  {id:'main', label:'In your own words, what are the main concerns that led to this referral?', type:'textarea'},
  {id:'onset', label:'When did this start?', type:'select', options:['Less than a month ago','1 to 6 months ago','6 to 12 months ago','1 to 2 years ago','More than 2 years ago','As long as I can remember']},
  {id:'trigger', label:'Did anything happen around the time it started?', type:'textarea'},
  {id:'impact', label:'How is it affecting your work, home life or relationships?', type:'textarea'},
  {id:'tried', label:'What have you tried so far, and did it help?', type:'textarea'}

const RISK_RE = /\b(kill(ing)? myself|suicid\w*|end(ing)? (my life|it all)|better off dead|(don'?t|do not) want to (live|be alive|be here|wake up)|hurt(ing)? myself|cut(ting)? myself|overdos\w*|take my (own )?life|no reason to live|want to die|wish i (was|were) dead)\b/i;

const LETTER_RULES = `You draft three letters from an approved psychiatric intake summary and the psychiatrist's own plan. Use only what the summary and plan say. Never invent treatments, doses, diagnoses or follow-up dates. If the plan is empty, write "[Recommendations to be added by the psychiatrist]" where recommendations belong.

1. "gp": consultation letter to the referring physician. Open with a 2-3 sentence case summary, then "Recommendations" as a short numbered list taken from the plan, then a brief assessment summary (history, risk, scores). Clinical register. End with "Sincerely," and the psychiatrist's name.
2. "patient": visit summary written to the patient in plain language (grade 6-8 reading level), warm and direct: what was discussed, the plan, what to do if things get worse (call or text 9-8-8, or 911 in an emergency). No new information.
3. "work": letter to the employer about function at work. Describe current functional limitations and suggested accommodations or timing only as supported by the summary and plan. Do NOT include diagnoses, symptoms, medications, history or risk details unless "workConsent" is true, in which case a diagnosis named in the plan may be stated. If the summary does not support specific restrictions, say they will follow after assessment.

Return ONLY this JSON object: {"gp":"...","patient":"...","work":"..."} with line breaks as \\n.`;

const has = v => Array.isArray(v) ? v.length>0 : (v!==undefined && v!==null && v!==false && String(v).trim()!=='');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, 3600); }

function ageFrom(dob){ const d=new Date(dob); if(!dob || isNaN(d)) return ''; const n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) a--; return a>0 && a<120 ? a : ''; }
function fmtVal(f, v){
  if(!has(v)) return '';
  if(f.type==='rows') return v.map(r=>'• '+f.cols.filter(c=>has(r[c.id])).map(c=>`${c.label}: ${r[c.id]}`).join('; ')).join('\n');
  if(Array.isArray(v)) return v.join(', ');
  if(f.type==='check') return 'Yes';
  if(f.type===YN) return {yes:'Yes', no:'No', discuss:'Prefers to discuss in person'}[v] || v;

}

/* ---------- State and storage ---------- */
const S = {db:null, sample:null, dict:null, intakes:{}, loaded:false, offline:false, loadErr:null,
  view:'list', id:null, tab:'overview', pt:null, ptPhase:null, secIdx:0, crisis:false, busy:{}, q:{}, src:null, deferRender:false, dictLive:false};

function persist(id, patch){
  const it = S.intakes[id];
  if(it) S.intakes[id] = Object.assign({}, it, clone(patch));
  if(!S.db) return Promise.resolve();
  S.q[id] = (S.q[id] || Promise.resolve())
    .then(()=>S.db.doc('intakes/'+id).update(clone(patch)))
    .catch(e=>toast('Could not save: '+(e && e.code || 'error')));
  return S.q[id];
}
/* Full replace, so cleared answers are really removed */
function saveDoc(doc){
  S.intakes[doc.id] = clone(doc);
  if(!S.db) return Promise.resolve();
  S.q[doc.id] = (S.q[doc.id] || Promise.resolve())
    .then(()=>S.db.doc('intakes/'+doc.id).set(clone(doc)))
    .catch(e=>toast('Could not save: '+(e && e.code || 'error')));
  return S.q[doc.id];
}
const addEvent = (it, label) => { it.timeline = (it.timeline||[]).concat([{ts:now(), label}]); return it.timeline; };
function addAlert(it, source, text){
  it.risk = Object.assign({level:'none', summary:'', alerts:[]}, it.risk);
  it.risk.alerts = (it.risk.alerts||[]).concat([{ts:now(), source, text}]);
  it.status = 'urgent';
  persist(it.id, {risk:it.risk, status:'urgent', updatedAt:now()});
}

/* ---------- Routing ---------- */
function route(){
  const h = (location.hash||'').replace(/^#/,'');
  let m;
  if(!h || h==='intakes'){ S.view='list'; S.id=null; }
  else if(h==='new'){ S.view='new'; }
  else if(h==='setup' && STANDALONE){ S.view='setup'; }
  else if((m=h.match(/^i-([a-z0-9-]+)$/))){ if(S.id!==m[1]){ S.tab='overview'; S.src=null; } S.view='detail'; S.id=m[1]; }
  else if((m=h.match(/^p-([a-z0-9-]+)$/))){ if(S.view!=='patient' || S.id!==m[1]){ S.pt=null; S.ptPhase=null; S.crisis=false; S.qDraft=null; S.cDraft=null; S.cssrsAfter=null; S.lastScreen=null; } S.view='patient'; S.id=m[1]; }
  else { S.view='list'; }
  render();
  window.scrollTo(0,0);
}
const go = h => { if(location.hash === '#'+h) route(); else location.hash = h; };

/* ---------- Render root ---------- */
function render(fromData){
  const app = $('#app');
  if(S.view==='patient'){ renderPatient(app); return; }
  const active = document.activeElement;
  if(fromData && active && app.contains(active) && (active.isContentEditable || /TEXTAREA|INPUT|SELECT/.test(active.tagName)) && S.view===S.lastView && S.id===S.lastId){ S.deferRender = true; return; }
  S.lastView = S.view; S.lastId = S.id; S.deferRender=false;
  app.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand"><b>Anamnesis</b><span>prototype</span></div>
      <a class="nav ${S.view==='list'||S.view==='detail'?'on':''}" href="#intakes">Intakes</a>
      <a class="nav ${S.view==='new'?'on':''}" href="#new">New intake</a>
      ${STANDALONE?`<a class="nav ${S.view==='setup'?'on':''}" href="#setup">Setup</a>`:''}
      <div class="foot">Fictional patients only. Not for real health information.</div>
    </aside>
    <main class="main"><div class="wrap" id="view"></div></main>
  </div>`;
  const v = $('#view');
  const notes = [];
  if(S.offline) notes.push('Saving is unavailable in this view, so intakes last only until you reload.');
  if(S.loadErr) notes.push('Saved intakes could not be loaded ('+esc(S.loadErr)+').');
  if(!S.loaded && !S.offline) notes.push('Loading saved intakes…');
  if(notes.length) v.insertAdjacentHTML('beforeend', `<div class="banner">${notes.join(' ')}</div>`);
  if(S.view==='list') renderList(v);
  else if(S.view==='new') renderNew(v);
  else if(S.view==='detail') renderDetail(v);
  else if(S.view==='setup') renderSetup(v);
}
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(S.deferRender){ const a=document.activeElement; if(!(a && (a.isContentEditable || /TEXTAREA|INPUT|SELECT/.test(a.tagName)))) render(); } }, 50); });

function renderList(v){
  const rows = Object.values(S.intakes).sort((a,b)=>{
    const ua = (a.status==='urgent' || riskRank(a.risk?.level)>=3) ? 1 : 0, ub = (b.status==='urgent' || riskRank(b.risk?.level)>=3) ? 1 : 0;
    return ub-ua || (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
  });
  v.insertAdjacentHTML('beforeend', `<div class="row"><div><h1>Intakes</h1><p class="muted">Referrals sent to patients, newest first. Anything flagged for safety sits at the top.</p></div><div class="spacer"></div><a class="btn primary" href="#new">New intake</a></div>`);
  if(!rows.length){
    v.insertAdjacentHTML('beforeend', `<div class="card empty"><h2>No intakes yet</h2><p class="muted">Create an intake from a referral, then open the patient view and fill in the forms as a made-up patient.</p><div class="row" style="justify-content:center"><a class="btn primary" href="#new">Create the first intake</a>${STANDALONE?'<a class="btn" href="#setup">Load the sample case</a>':''}</div></div>`);
    return;
  }
  v.insertAdjacentHTML('beforeend', `<div class="tablewrap"><table class="list"><thead><tr><th>Patient</th><th>Referred by</th><th>Status</th><th>Safety</th><th>Scores</th><th>Updated</th></tr></thead><tbody>${rows.map(it=>{
    const st = STATUS[it.status]||[it.status,''], urgent = it.status==='urgent' || riskRank(it.risk?.level)>=3;
    const ac = auditC(it.forms?.substances);
    const sc = [it.q?.phq9 ? 'PHQ-9 '+it.q.phq9.total : '', it.q?.gad7 ? 'GAD-7 '+it.q.gad7.total : '', it.q?.cssrs ? 'C-SSRS '+it.q.cssrs.level : '', ac!==null ? 'AUDIT-C '+ac : ''].filter(Boolean).join(' · ');
    const assessed = it.q?.cssrs || it.q?.phq9;
    const rk = RISKPILL[it.risk?.level||'none'];
    return `<tr class="click ${urgent?'urgent':''}" data-id="${esc(it.id)}"><td><b>${esc(it.patient?.name)}</b><div class="small muted">${esc([it.patient?.age, it.patient?.pronouns].filter(Boolean).join(' · '))}</div></td>
      <td>${esc(it.referrer||'—')}</td><td><span class="pill ${st[1]}">${esc(st[0])}</span></td>
      <td>${assessed || (it.risk?.alerts||[]).length ? riskPill(it) : '<span class="muted small">Not assessed</span>'}${(it.risk?.alerts||[]).length?` <span class="small muted">${it.risk.alerts.length} alert${it.risk.alerts.length>1?'s':''}</span>`:''}</td>
      <td class="mono">${esc(sc||'—')}</td><td class="mono">${esc(fmt(it.updatedAt||it.createdAt))}</td></tr>`;
  }).join('')}</tbody></table></div>`);
  $$('tr.click', v).forEach(tr=>tr.onclick=()=>go('i-'+tr.dataset.id));
}

    <p class="muted">${esc([it.patient?.age && it.patient.age+' years', it.patient?.pronouns, 'for '+(it.clinician||'')].filter(Boolean).join(' · '))}</p></div>
    <div class="spacer"></div>
    <div class="row"><span class="pill ${st[1]}">${esc(st[0])}</span>${(it.q?.cssrs||it.q?.phq9||(it.risk?.alerts||[]).length)?riskPill(it):''}<a class="btn" href="#p-${esc(it.id)}">Open patient view</a></div>
  </div>
  <div class="tabs" role="tablist">${[['overview','Overview'],['responses','Responses'],['note','Summary'],['letters','Letters']].map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}" role="tab">${l}</button>`).join('')}</div>
  <div id="tabbody" class="stack"></div>`);
  $$('.tab', v).forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.src=null; render(); });
  ({overview:tabOverview, responses:tabResponses, note:tabNote, letters:tabLetters})[S.tab](tb(), it);
}
const tb = () => $('#tabbody');

function sectionState(it, id){ const s = it.formStatus?.[id]; return s==='done' ? 'done' : s==='skipped' ? 'deferred' : ''; }
function tabOverview(tb, it){
  const alerts = it.risk?.alerts||[];
  if(alerts.length || riskRank(it.risk?.level)>=2){
    tb.insertAdjacentHTML('beforeend', `<div class="card ${riskRank(it.risk?.level)>=3||it.status==='urgent'?'crit':''}"><div class="row"><h2>Safety</h2>${riskPill(it)}${it.status==='urgent'?`<div class="spacer"></div><button class="btn sm" id="ackUrgent">Mark reviewed</button>`:''}</div>
      ${it.risk?.summary?`<p>${esc(it.risk.summary)}</p>`:''}
      ${alerts.length?`<ul class="timeline">${alerts.map(a=>`<li><span>${esc(a.source)}: ${esc(a.text)}</span><span>${esc(fmt(a.ts))}</span></li>`).join('')}</ul>`:''}
      <p class="small muted">In a production system these alerts would page the on-call clinician with a stated response time. Here they are only shown on this page.</p></div>`);
    const ack = $('#ackUrgent'); if(ack) ack.onclick=()=>{ const tl=addEvent(clone(it),'Safety alert reviewed'); persist(it.id,{status: it.note?(it.note.approved?'note_approved':'note_draft'):(it.submittedAt?'completed':'in_progress'), timeline:tl, updatedAt:now()}); render(); };
  }
  const qDone = SCREENS.every(k=>it.q?.[k] || (it.qSkipped||[]).includes(k));
  const nDone = FORM.filter(s=>it.formStatus?.[s.id]).length;
  tb.insertAdjacentHTML('beforeend', `<div class="grid2">
    <div class="stack">
      <div class="card"><div class="row"><h2>Patient forms</h2><div class="spacer"></div><span class="small muted">${it.submittedAt?'Submitted '+esc(fmt(it.submittedAt)):`${nDone} of ${FORM.length} sections`}</span></div>
        ${it.consentedAt ? '' : `<p class="muted">Not started. In a live product the patient gets a secure link by text or email. In this prototype, open the patient view yourself and fill in the forms as a made-up patient.</p>`}
        <div class="mods"><span class="mod ${qDone?'done':''}"><i></i>Questionnaires</span>${FORM.map(s=>`<span class="mod ${sectionState(it,s.id)}"><i></i>${esc(s.name)}</span>`).join('')}</div>
        <p class="small muted">Green: completed. Amber: patient chose to discuss at the visit.</p>
        <div class="row"><a class="btn" href="#p-${esc(it.id)}">${it.submittedAt?'View as patient':it.consentedAt?'Continue as patient':'Start as patient'}</a>${it.consentedAt?`<button class="btn" id="goResp">See responses</button><button class="btn primary" id="goNote">${it.note?'Open summary':'Build summary'}</button>`:''}</div>
      </div>
      <div class="card"><h2>Referral letter</h2>${it.referralText?`<div class="doctext">${esc(it.referralText)}</div>`:'<p class="muted">None provided.</p>'}</div>
      <div class="card"><h2>Medication list from referral</h2>${it.medsText?`<div class="doctext">${esc(it.medsText)}</div>`:'<p class="muted">None provided.</p>'}</div>
    </div>
    <div class="stack">
      <div class="card"><h2>Questionnaires</h2>${scoresHTML(it)}</div>
      <div class="card"><h2>Progress</h2><ul class="timeline">${(it.timeline||[]).map(e=>`<li><span>${esc(e.label)}</span><span>${esc(fmt(e.ts))}</span></li>`).join('')}</ul></div>
    </div>
  </div>`);
  const gn = $('#goNote'); if(gn) gn.onclick=()=>{ if(!it.note) buildSummary(it.id); S.tab='note'; render(); };
  const gr = $('#goResp'); if(gr) gr.onclick=()=>{ S.tab='responses'; render(); };
}
function scoresHTML(it){
  const skipped = k => (it.qSkipped||[]).includes(k);
  const ac = auditC(it.forms?.substances);
  return ['phq9','gad7'].map(k=>{ const r=it.q?.[k], Q=QS[k];
    return r ? `<div class="score"><b>${r.total}</b><span class="muted">/ ${Q.max}</span><span>${esc(Q.name)} · ${esc(band(Q,r.total))}</span></div>${k==='phq9'?`<p class="small ${r.items[8]>0?'':'muted'}">Item 9: ${esc(OPTS4[r.items[8]])}${r.items[8]>0?' — flagged':''}</p>`:''}${r.diff?`<p class="small muted">Difficulty: ${esc(r.diff)}</p>`:''}`
      : `<p class="muted">${esc(Q.name)} ${skipped(k)?'skipped: patient chose to discuss in person':'not yet completed'}.</p>`; }).join('')
  + (it.q?.cssrs ? `<div class="row"><span class="pill ${RISKPILL[it.q.cssrs.level][1]}">C-SSRS</span><span>${esc(CSSRS_LABEL[it.q.cssrs.level])}</span></div><p class="small muted">${esc(cssrsSummary(it.q.cssrs))}</p>` : `<p class="muted">C-SSRS screener ${skipped('cssrs')?'skipped: patient chose to discuss in person':'not yet completed'}.</p>`)
  + (ac!==null ? `<div class="score"><b>${ac}</b><span class="muted">/ 12</span><span>AUDIT-C · ${ac>=4?'positive':ac===3?'positive for women':'negative'}</span></div>` : '')
  + `<p class="small muted">PHQ-9 and GAD-7: Drs. Spitzer, Williams, Kroenke and colleagues, free to reproduce. C-SSRS screener: The Columbia Lighthouse Project. AUDIT-C: items 1 to 3 of the WHO AUDIT.</p>`;
}

function tabResponses(tb, it){
  if(!it.consentedAt && !(it.transcript||[]).length){ tb.insertAdjacentHTML('beforeend', `<div class="card empty"><h2>No responses yet</h2><p class="muted">Answers appear here as the patient completes each section.</p><a class="btn" href="#p-${esc(it.id)}">Open patient view</a></div>`); return; }
  tb.insertAdjacentHTML('beforeend', `<div class="card"><h2>Questionnaires</h2>${scoresHTML(it)}
    ${it.q?.phq9?`<details><summary class="small">PHQ-9 item answers</summary><dl class="resp small">${PHQ9.items.map((q,i)=>`<p>${i+1}. ${esc(q)}: <b>${esc(OPTS4[it.q.phq9.items[i]])}</b></p>`).join('')}</dl></details>`:''}
    ${it.q?.gad7?`<details><summary class="small">GAD-7 item answers</summary>${GAD7.items.map((q,i)=>`<p class="small">${i+1}. ${esc(q)}: <b>${esc(OPTS4[it.q.gad7.items[i]])}</b></p>`).join('')}</details>`:''}</div>`);
  FORM.forEach(s=>{
    const vals = it.forms?.[s.id]||{}, stt = it.formStatus?.[s.id];
    const rows = s.fields.filter(f=>has(vals[f.id]));
    tb.insertAdjacentHTML('beforeend', `<div class="card resp"><div class="row"><h2>${esc(s.name)}</h2><div class="spacer"></div>${stt==='done'?'<span class="pill ok">Completed</span>':stt==='skipped'?'<span class="pill warn">Discuss in person</span>':'<span class="pill">Not started</span>'}</div>
      ${rows.length ? `<dl>${rows.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(fmtVal(f, vals[f.id]))}</dd>`).join('')}</dl>` : `<p class="muted small">${stt==='skipped'?'The patient chose to discuss this section in person.':'No answers.'}</p>`}</div>`);
  });
  if((it.transcript||[]).length) tb.insertAdjacentHTML('beforeend', `<div class="card"><h2>Earlier AI interview transcript</h2><div class="tx">${it.transcript.map((t,i)=>`<div class="t ${t.r}"><span class="mono muted">T${i}</span><span class="mono muted">${t.r==='ai'?'Assistant':t.r==='pt'?'Patient':'App'}</span><span>${esc(t.t)}</span></div>`).join('')}</div></div>`);
}

/* ---------- Summary note, built from the answers ---------- */
function buildNote(it){
  const F = it.forms||{}, g = (s,f)=>F[s]?.[f], src = (s,f)=>({kind:'form', sec:s, field:f});
  const lc = s => String(s).charAt(0).toLowerCase() + String(s).slice(1);
  const list = a => a.length<=1 ? a.join('') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1];
  const real = a => (a||[]).filter(x=>!/^None/.test(x));
  const q = (s,f)=>`“${String(g(s,f)).trim().replace(/\s+/g,' ')}”`;
  const sections = [], mk = (id,title)=>{ const s={id,title,statements:[]}; sections.push(s); return s; };
  const add = (s, text, ...sources) => s.statements.push({text, sources});

  // Identifying data
  const idS = mk('id','Identifying data');
  const name = g('about','prefName') || (it.patient?.name||'').replace(/\s*\(.*\)$/,'');
  const age = ageFrom(g('about','dob')) || it.patient?.age;
  const pron = g('about','pronouns') || it.patient?.pronouns;
  add(idS, `${name}${age?`, ${age} years old`:''}${pron?` (${pron})`:''}.`, ...[g('about','prefName')&&src('about','prefName'), g('about','dob')&&src('about','dob'), g('about','pronouns')&&src('about','pronouns')].filter(Boolean));
  if(g('about','relationship')) add(idS, `Relationship status: ${lc(g('about','relationship'))}.`, src('about','relationship'));
  if(g('about','livesWith') || g('about','housing')) add(idS, `${g('about','livesWith')?`Lives with ${g('about','livesWith')}`:'Housing'}${g('about','housing')?`${g('about','livesWith')?' (':': '}${lc(g('about','housing'))}${g('about','livesWith')?')':''}`:''}.`, ...[g('about','livesWith')&&src('about','livesWith'), g('about','housing')&&src('about','housing')].filter(Boolean));
  if(g('about','children')) add(idS, `Children or dependants: ${g('about','children')}.`, src('about','children'));
  if(g('social','employment')) add(idS, `${g('social','employment')}.${g('social','occupation')?` Work: ${g('social','occupation')}.`:''}`, src('social','employment'), ...(g('social','occupation')?[src('social','occupation')]:[]));

  // Reason for referral
  const rf = mk('rfr','Reason for referral');
  if(it.referrer) add(rf, `Referred by ${it.referrer}${it.referralText?'; see referral letter':''}.`, {kind:'referral'});
  if(g('concerns','main')) add(rf, `In the patient's words: ${q('concerns','main')}`, src('concerns','main'));
  if(g('concerns','onset')) add(rf, `Onset: ${lc(g('concerns','onset'))}.`, src('concerns','onset'));
  if(g('concerns','trigger')) add(rf, `Around the onset: ${q('concerns','trigger')}`, src('concerns','trigger'));
  if(g('concerns','impact')) add(rf, `Impact on function: ${q('concerns','impact')}`, src('concerns','impact'));
  if(g('concerns','tried')) add(rf, `Tried so far: ${q('concerns','tried')}`, src('concerns','tried'));

  // Scales
  const sc = mk('scales','Questionnaire scores');
  if(it.q?.phq9){ const r=it.q.phq9; add(sc, `PHQ-9 ${r.total}/27 (${lc(band(PHQ9,r.total))}). Item 9, thoughts of being better off dead or of self-harm: ${lc(OPTS4[r.items[8]])}.${r.diff?` Functional difficulty: ${lc(r.diff)}.`:''}`, {kind:'phq9'}); }
  if(it.q?.gad7){ const r=it.q.gad7; add(sc, `GAD-7 ${r.total}/21 (${lc(band(GAD7,r.total))}).${r.diff?` Functional difficulty: ${lc(r.diff)}.`:''}`, {kind:'gad7'}); }
  if(it.q?.cssrs) add(sc, `C-SSRS screener: ${lc(CSSRS_LABEL[it.q.cssrs.level])} (${cssrsSummary(it.q.cssrs)}).`, {kind:'cssrs'});
  const ac = auditC(F.substances);
  if(ac!==null) add(sc, `AUDIT-C ${ac}/12 (${ac>=4?'positive':ac===3?'positive for women, negative for men':'negative'}; cut-off 3 for women, 4 for men).`, src('substances','a1'));

  // Safety
  const rs = mk('risk','Safety and risk');
  const cs = it.q?.cssrs;
  if(cs){
    const yes = cssrsVisible(cs.a).filter(i=>cs.a[i.n] && i.n!==7).map(i=>i.n);
    add(rs, yes.length ? `C-SSRS: endorses ${list(yes.map(n=>({1:'wish to be dead',2:'non-specific suicidal thoughts',3:'thoughts of method',4:'intent',5:'a plan with intent',6:'lifetime suicidal behaviour'}[n])))}${cs.a[6]?(cs.a[7]?' (within the past 3 months)':' (more than 3 months ago)'):''}.` : 'C-SSRS: denies wish to be dead, suicidal thoughts and suicidal behaviour.', {kind:'cssrs'});
  }
  if(it.q?.phq9?.items[8]>0) add(rs, `PHQ-9 item 9 endorsed (${lc(OPTS4[it.q.phq9.items[8]])}).`, {kind:'phq9'});
  if(g('psych','attempt')==='yes') add(rs, `Reports past suicide attempt(s)${g('psych','attemptDetail')?`: ${q('psych','attemptDetail')}`:'.'}`, src('psych','attempt'), ...(g('psych','attemptDetail')?[src('psych','attemptDetail')]:[]));
  else if(g('psych','attempt')==='no') add(rs, 'Denies past suicide attempts.', src('psych','attempt'));
  if(g('psych','selfharm')==='yes') add(rs, `Reports non-suicidal self-harm${g('psych','selfharmDetail')?`, most recently ${g('psych','selfharmDetail')}`:''}.`, src('psych','selfharm'));
  else if(g('psych','selfharm')==='no') add(rs, 'Denies non-suicidal self-harm.', src('psych','selfharm'));
  if(g('social','firearms')==='yes') add(rs, 'Has access to firearms.', src('social','firearms'));
  else if(g('social','firearms')==='no') add(rs, 'No access to firearms.', src('social','firearms'));
  if(!rs.statements.length) add(rs, 'Safety questions were not completed. Assess at the visit.');

  // Past psychiatric history
  const ph = mk('pph','Past psychiatric history');
  const dx = real(g('psych','dx'));
  if(dx.length) add(ph, `Previous diagnoses reported: ${list(dx.map(lc))}${g('psych','dxOther')?`; also ${g('psych','dxOther')}`:''}.`, src('psych','dx'));
  else if(g('psych','dx')) add(ph, `No previous diagnoses reported${g('psych','dxOther')?` other than ${g('psych','dxOther')}`:''}.`, src('psych','dx'));
  const care = real(g('psych','care'));
  if(care.length) add(ph, `Previous care: ${list(care.map(lc))}${g('psych','careDetail')?`. ${q('psych','careDetail')}`:'.'}`, src('psych','care'), ...(g('psych','careDetail')?[src('psych','careDetail')]:[]));
  else if(g('psych','care')) add(ph, 'No previous mental health care.', src('psych','care'));
  if(g('psych','hosp')==='yes') add(ph, `Previous psychiatric admission${g('psych','hospDetail')?`: ${q('psych','hospDetail')}`:'.'}`, src('psych','hosp'));
  else if(g('psych','hosp')==='no') add(ph, 'No previous psychiatric admissions.', src('psych','hosp'));
  const otx = real(g('psych','otherTx'));
  if(otx.length) add(ph, `Other treatments: ${list(otx)}.`, src('psych','otherTx'));

  // Medications
  const pm = mk('pastmeds','Past psychiatric medications');
  if(g('pastMeds','none')) add(pm, 'No previous psychiatric medications.', src('pastMeds','none'));
  (g('pastMeds','rows')||[]).forEach(r=>add(pm, `${r.name||'Unnamed medication'}${r.dose?` up to ${r.dose}`:''}${r.duration?` for ${r.duration}`:''}: ${r.effect?lc(r.effect)==='a lot'?'helped a lot':lc(r.effect)==='somewhat'?'helped somewhat':lc(r.effect)==='not at all'?'no benefit':lc(r.effect):'benefit not stated'}${r.stop?`; ${r.stop}`:''}.`, src('pastMeds','rows')));
  const cm = mk('curmeds','Current medications and allergies');
  if(g('curMeds','none')) add(cm, 'Takes no medications.', src('curMeds','none'));
  (g('curMeds','rows')||[]).forEach(r=>add(cm, `${r.name||'Unnamed medication'}${r.dose?` ${r.dose}`:''}${r.freq?`, ${lc(r.freq)}`:''}${r.for?` (for ${lc(r.for)})`:''}${r.adh && r.adh!=='Yes'?`. Adherence: ${lc(r.adh)}`:''}.`, src('curMeds','rows')));
  if(g('curMeds','nka')) add(cm, 'No known allergies.', src('curMeds','nka'));
  else if(g('curMeds','allergies')) add(cm, `Allergies: ${g('curMeds','allergies')}.`, src('curMeds','allergies'));
  if(it.medsText) add(cm, 'A medication list was provided with the referral.', {kind:'meds'});

  // Medical
  const md = mk('med','Medical history');
  const cond = real(g('medical','conditions'));
  if(cond.length) add(md, `Medical conditions: ${list(cond.map(lc))}.`, src('medical','conditions'));
  else if(g('medical','conditions')) add(md, 'No listed medical conditions.', src('medical','conditions'));
  if(g('medical','conditionsOther')) add(md, `Other: ${q('medical','conditionsOther')}`, src('medical','conditionsOther'));
  if(g('medical','headInjury')==='yes') add(md, 'History of head injury or concussion.', src('medical','headInjury'));
  if(g('medical','surgeries')) add(md, `Surgeries and admissions: ${q('medical','surgeries')}`, src('medical','surgeries'));
  if(g('medical','pregnancy') && !/^Not/.test(g('medical','pregnancy'))) add(md, `${g('medical','pregnancy')}.`, src('medical','pregnancy'));
  if(g('medical','familyDoctor')) add(md, `Primary care: ${g('medical','familyDoctor')}.`, src('medical','familyDoctor'));

  // Substances
  const su = mk('subs','Substance use');
  if(g('substances','a1')==='Never') add(su, 'Does not drink alcohol.', src('substances','a1'));
  else if(g('substances','a1')) add(su, `Alcohol: drinks ${lc(g('substances','a1'))}${g('substances','a2')?`, ${g('substances','a2')} standard drinks on a typical drinking day`:''}${g('substances','a3')?`; six or more drinks on one occasion ${lc(g('substances','a3'))}`:''}.`, src('substances','a1'), ...(g('substances','a2')?[src('substances','a2')]:[]), ...(g('substances','a3')?[src('substances','a3')]:[]));
  if(g('substances','cannabis')) add(su, `Cannabis: ${lc(g('substances','cannabis'))}${g('substances','cannabisHow')?` (${g('substances','cannabisHow')})`:''}.`, src('substances','cannabis'));
  if(g('substances','tobacco')) add(su, `Tobacco or nicotine: ${lc(g('substances','tobacco'))}.`, src('substances','tobacco'));
  if(has(g('substances','caffeine'))) add(su, `${g('substances','caffeine')} caffeinated drinks a day.`, src('substances','caffeine'));
  const dr = real(g('substances','drugs'));
  if(dr.length) add(su, `Other substances in the past year: ${list(dr.map(lc))}${g('substances','drugsDetail')?`. ${q('substances','drugsDetail')}`:'.'}`, src('substances','drugs'));
  else if(g('substances','drugs')) add(su, 'No other substance use in the past year.', src('substances','drugs'));
  if(g('substances','subsTx')==='yes') add(su, 'Has had treatment or support for substance use.', src('substances','subsTx'));
  if(g('substances','subsConcern')==='yes') add(su, 'The patient or people close to them are concerned about their use.', src('substances','subsConcern'));

  // Family
  const fm = mk('fam','Family history');
  const fh = real(g('family','fam'));
  if(fh.length) add(fm, `Family history of ${list(fh.map(lc))}${g('family','famDetail')?`: ${q('family','famDetail')}`:'.'}`, src('family','fam'), ...(g('family','famDetail')?[src('family','famDetail')]:[]));
  else if(g('family','fam')) add(fm, 'No known family psychiatric history.', src('family','fam'));

  // Social
  const so = mk('soc','Personal and social history');
  if(g('social','born')) add(so, `Born and raised: ${g('social','born')}.`, src('social','born'));
  if(g('social','childhood')) add(so, `Childhood: ${q('social','childhood')}`, src('social','childhood'));
  if(g('social','education')) add(so, `Education: ${lc(g('social','education'))}.`, src('social','education'));
  if(g('social','leave')) add(so, `On leave: ${g('social','leave')}.`, src('social','leave'));
  if(g('social','work')) add(so, `Work or school stressors: ${q('social','work')}`, src('social','work'));
  if(g('social','support')) add(so, `Supports: ${q('social','support')}`, src('social','support'));
  if(g('social','finances') && g('social','finances')!=='None') add(so, `${g('social','finances')} money worries.`, src('social','finances'));
  if(g('social','legal')==='yes') add(so, `Current legal issues${g('social','legalDetail')?`: ${g('social','legalDetail')}`:''}.`, src('social','legal'));
  if(g('social','trauma')==='yes') add(so, 'Reports past traumatic experiences; no details given on the form.', src('social','trauma'));
  else if(g('social','trauma')==='no') add(so, 'Denies past traumatic experiences.', src('social','trauma'));

  // Goals
  const go_ = mk('goals','Patient goals and questions');
  if(g('goals','hopes')) add(go_, `Hopes for the appointment: ${q('goals','hopes')}`, src('goals','hopes'));
  if(g('goals','questions')) add(go_, `Questions: ${q('goals','questions')}`, src('goals','questions'));
  if(g('goals','other')) add(go_, `Also wants the psychiatrist to know: ${q('goals','other')}`, src('goals','other'));

  // For the psychiatrist to consider (rule-based prompts, not diagnoses)
  const considerations = [];
  const con = (text, ...sources) => considerations.push({text, sources});
  if(it.q?.phq9?.total>=10) con(`PHQ-9 in the ${lc(band(PHQ9,it.q.phq9.total))} range: assess for a depressive episode.`, {kind:'phq9'});
  if(it.q?.gad7?.total>=10) con(`GAD-7 in the ${lc(band(GAD7,it.q.gad7.total))} range: assess for an anxiety disorder.`, {kind:'gad7'});
  if(cs && riskRank(cs.level)>=2) con(`C-SSRS ${cs.level} risk: complete a full suicide risk assessment and safety plan at the visit.`, {kind:'cssrs'});
  if(ac!==null && ac>=3) con('AUDIT-C positive or borderline: assess alcohol use further, including withdrawal risk and interactions with medications.', src('substances','a1'));
  if(dr.length) con('Non-prescribed substance use: assess pattern and contribution to symptoms.', src('substances','drugs'));
  const limited = (g('pastMeds','rows')||[]).filter(r=>/Not at all|Somewhat|worse/.test(r.effect||''));
  if(limited.length>=2) con(`${limited.length} previous medication trials with limited benefit or worsening: review dose and duration of each trial.`, src('pastMeds','rows'));
  const organic = cond.filter(c=>/Thyroid|Sleep apnea|Stroke|Seizures|Chronic pain/.test(c));
  if(organic.length || g('medical','headInjury')==='yes') con(`Medical factors that can affect mood or cognition: ${list(organic.map(lc).concat(g('medical','headInjury')==='yes'?['head injury']:[]))}.`, src('medical','conditions'));
  const allText = s => Object.values(F[s]||{}).flatMap(x=>Array.isArray(x)?x.map(y=>typeof y==='object'?Object.values(y).join(' '):y):[x]).filter(x=>typeof x==='string').join(' ');
  if(!cond.includes('Sleep apnea') && /snor|chok|gasp|stops? breathing|stopped breathing|apnea/i.test(allText('medical')+' '+allText('concerns')))
    con('Patient mentions snoring, choking or breathing pauses in sleep: consider screening for obstructive sleep apnea (for example STOP-Bang).', ...(g('medical','conditionsOther')?[src('medical','conditionsOther')]:[src('concerns','main')]));
  if(/Pregnant|Breastfeeding|Planning/.test(g('medical','pregnancy')||'')) con(`${g('medical','pregnancy')}: consider in medication choices.`, src('medical','pregnancy'));
  if(dx.includes('Bipolar disorder') || fh.includes('Bipolar disorder')) con(`${dx.includes('Bipolar disorder')?'Previous bipolar diagnosis':'Family history of bipolar disorder'}: screen for past hypomania or mania before antidepressant changes.`, src(dx.includes('Bipolar disorder')?'psych':'family', dx.includes('Bipolar disorder')?'dx':'fam'));

  // Unresolved: things that do not line up
  const unresolved = [];
  const curNames = (g('curMeds','rows')||[]).map(r=>(r.name||'').toLowerCase()).join(' ');
  (it.medsText||'').split('\n').map(l=>l.trim()).filter(l=>l && !/allerg/i.test(l)).forEach(line=>{
    const word = (line.match(/[A-Za-z]{4,}/)||[])[0];
    if(word && !curNames.includes(word.toLowerCase()) && (g('curMeds','rows') || g('curMeds','none'))) unresolved.push({text:`The referral medication list includes "${line}", but the patient did not list it as a current medication.`});
  });
  if(it.q?.phq9?.items[8]>0 && cs && cs.level==='none') unresolved.push({text:`PHQ-9 item 9 endorsed (${lc(OPTS4[it.q.phq9.items[8]])}) but the C-SSRS screener was negative. Clarify.`});
  const riskWords = FORM.map(s=>allText(s.id)).join(' ').match(RISK_RE);
  if(riskWords && (!cs || cs.level==='none')) unresolved.push({text:`The patient wrote "${riskWords[0]}" in their answers${cs?', but the C-SSRS screener was negative':' and did not complete the C-SSRS'}. Assess suicide risk directly.`});
  if(g('psych','attempt')==='yes' && cs && !cs.a[6]) unresolved.push({text:'Past suicide attempt reported in the history section, but C-SSRS question 6 (lifetime suicidal behaviour) was answered no. Clarify.'});
  (g('curMeds','rows')||[]).filter(r=>r.adh && r.adh!=='Yes').forEach(r=>unresolved.push({text:`${r.name||'A medication'}: ${lc(r.adh)}.`}));

  // Not covered
  const notCovered = [];
  SCREENS.forEach(k=>{ if((it.qSkipped||[]).includes(k)) notCovered.push(`${k==='cssrs'?'C-SSRS screener':QS[k].name}: patient chose to discuss in person`); });
  FORM.forEach(s=>{ const st=it.formStatus?.[s.id]; if(st==='skipped') notCovered.push(`${s.name}: patient chose to discuss in person`); else if(!st) notCovered.push(`${s.name}: not completed`);
    s.fields.forEach(f=>{ if(f.type===YN && g(s.id,f.id)==='discuss') notCovered.push(`${f.label.replace(/\?.*$/,'?')} Patient prefers to discuss in person.`); }); });

  const note = {sections, considerations, unresolved, notCovered, generatedAt:now(), approved:false};
  note.sections.forEach(s=>s.statements.forEach(st=>{ st.sources = st.sources||[]; }));
  return checkNote(it, note);
}
function srcLabel(s){ return s.kind==='form' ? (FSEC[s.sec]?.short||s.sec) : s.kind==='referral' ? 'Referral' : s.kind==='meds' ? 'Med list' : s.kind==='phq9' ? 'PHQ-9' : s.kind==='gad7' ? 'GAD-7' : s.kind==='cssrs' ? 'C-SSRS' : '?'; }
function verifySource(it, s){
  if(!s || !s.kind) return false;
  if(s.kind==='form') return has(it.forms?.[s.sec]?.[s.field]);
  if(s.kind==='phq9' || s.kind==='gad7' || s.kind==='cssrs') return !!it.q?.[s.kind];
  if(s.kind==='referral') return !!it.referrer || !!it.referralText;
  if(s.kind==='meds') return !!it.medsText;
  return false;
}
function checkNote(it, note){
  (note.sections||[]).concat([{statements:note.considerations||[]}]).forEach(sec=>(sec.statements||[]).forEach(st=>{
    st.sources = (st.sources||[]).filter(Boolean).map(s=>({...s, ok:verifySource(it,s)}));
    st.verified = st.sources.length===0 || st.sources.every(s=>s.ok);
  }));
  return note;
}
function buildSummary(id){
  const it = S.intakes[id]; if(!it) return;
  const note = buildNote(it);
  const tl = addEvent(clone(it), it.note ? 'Summary rebuilt from answers' : 'Summary drafted');
  persist(id, {note, status: it.status==='urgent' ? 'urgent' : 'note_draft', timeline:tl, updatedAt:now()});
}

function stmtHTML(st, k, si, j, locked){
  const groups = [];
  (st.sources||[]).forEach((s,x)=>{ const l = srcLabel(s); let g = groups.find(g=>g.l===l); if(!g){ g = {l, xs:[], ok:true}; groups.push(g); } g.xs.push(x); g.ok = g.ok && s.ok; });
  return `<span class="stmt ${st.verified?'':'unv'}"><span class="tx-edit" data-k="${k}.${si}.${j}" ${locked?'':'contenteditable="true"'} spellcheck="true">${esc(st.text)}</span>${groups.map(g=>`<button class="chip ${g.ok?'':'bad'}" data-src="${k}.${si}.${j}.${g.xs.join('-')}" title="${g.ok?'Matches the patient\'s answers':'Answer no longer present'}">${esc(g.l)}</button>`).join('')}${st.edited?'<span class="mono muted" title="Edited by you"> ✎</span>':''}</span>`;
}
function srcBlock(it, s){
  if(s.kind==='form'){ const f = FFIELD[s.sec]?.[s.field]; return {title:FSEC[s.sec]?.name||s.sec, body:(f?f.label+'\n':'') + (f ? fmtVal(f, it.forms?.[s.sec]?.[s.field]) || '(no answer)' : '')}; }
  if(s.kind==='referral') return {title:'Referral letter', body:it.referralText||`Referred by ${it.referrer||'unknown'}`};
  if(s.kind==='meds') return {title:'Medication list from referral', body:it.medsText||''};
  if(s.kind==='cssrs'){ const r=it.q?.cssrs; return {title:'C-SSRS screener', body: r ? cssrsVisible(r.a).map(i=>`${i.q} — ${r.a[i.n]?'Yes':'No'}`).join('\n')+`\n\n${CSSRS_LABEL[r.level]}` : 'Not completed.'}; }
  const r=it.q?.[s.kind]; return {title:QS[s.kind]?.name||s.kind, body: r ? QS[s.kind].items.map((q,i)=>`${i+1}. ${q} — ${OPTS4[r.items[i]]}`).join('\n')+`\n\nTotal ${r.total} (${band(QS[s.kind],r.total)})` : 'Not completed.'};
}
function srcPanelHTML(it){
  if(!S.src) return `<h3>Source</h3><p class="muted small">Click a tag after any sentence to see the patient's answers it came from.</p>`;
  const [k,si,j,xs] = S.src.split('.');
  const n = it.note; const st = (k==='s' ? n.sections[+si]?.statements : n.considerations)?.[+j];
  const srcs = String(xs).split('-').map(x=>st?.sources?.[+x]).filter(Boolean);
  if(!srcs.length) return `<h3>Source</h3><p class="muted">Not found.</p>`;
  const blocks = srcs.map(s=>srcBlock(it,s)), ok = srcs.every(s=>s.ok);
  return `<h3>${esc(blocks[0].title)}</h3>${ok?'<span class="pill ok">Matches</span>':'<span class="pill crit">Answer no longer present</span>'}${blocks.map(b=>`<div class="srcq">${esc(b.body)}</div>`).join('')}`;
}

/* ---------- Letters ---------- */
async function draftLetters(id){
  const it = S.intakes[id]; if(!it || S.busy[id]) return;
  if(!(await getSample())){ toast(noAIMsg()); return; }
  S.busy[id]='letters'; render();
  const noteText = (it.note.sections||[]).map(s=>`${s.title}:\n${(s.statements||[]).map(x=>'- '+x.text).join('\n')}`).join('\n\n');
  const prompt = `${LETTER_RULES}

Psychiatrist: ${it.clinician}. Referring physician: ${it.referrer||'unknown'}. Patient: ${it.patient?.name}.
workConsent: ${!!it.letters?.workConsent}

APPROVED SUMMARY:
${noteText}

PSYCHIATRIST'S PLAN:
${it.plan||'(empty)'}`;
  try{
    const L = await S.sample.json(prompt, {modelTier:'default', effort:'low', cache:false});
    if(!L || typeof L.gp!=='string') throw {code:'invalid_json'};
    const letters = {gp:L.gp, patient:L.patient||'', work:L.work||'', workConsent:!!it.letters?.workConsent, generatedAt:now(), approved:false};
    const tl = addEvent(clone(S.intakes[id]),'Letters drafted');
    persist(id, {letters, timeline:tl, updatedAt:now()});
  }catch(e){ toast(aiErr(e && e.code)); }
  delete S.busy[id]; render();
}

/* ---------- Dictation (clinician plan) ---------- */
function wireDictation(btn, ta, partialEl, onDone){
  if(!btn || !S.dict) return;
  btn.onclick = ()=>{
    if(S.dictLive){ S.dict.stop().catch(()=>{}); return; }
    S.dictTarget = {ta, partialEl, onDone, btn};
    S.dict.start().catch(e=>{ if(e && e.code==='not_granted'){ toast('Microphone access was declined. You can still type.'); btn.hidden=true; } else toast('Dictation could not start.'); });
  };
}
function setupDictation(){
  if(!S.dict) return;
  S.dict.onPartial(({text})=>{ const t=S.dictTarget; if(t?.partialEl) t.partialEl.textContent = text; });
  S.dict.onFinal(({text})=>{ const t=S.dictTarget; if(!t?.ta) return; t.ta.value = (t.ta.value ? t.ta.value.replace(/\s*$/,' ') : '') + text; if(t.partialEl) t.partialEl.textContent=''; t.onDone && t.onDone(); });
  S.dict.onState(({state})=>{ S.dictLive = state==='listening'; const b=S.dictTarget?.btn; if(b && b.isConnected){ b.classList.toggle('live', S.dictLive); b.textContent = S.dictLive ? 'Stop' : (b.dataset.label||'Dictate'); } });
}

const CAP = {};

const noAIMsg = () => window.claude

  : 'Letter drafting is off until you add an Anthropic API key under Setup.';

const LS = {get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch{} }};

function parseLoose(t){
  const tries = [t, (t.match(/```(?:json)?\s*([\s\S]*?)```/)||[])[1]];
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(a>=0 && b>a) tries.push(t.slice(a,b+1));
  for(const s of tries){ if(!s) continue; try{ return JSON.parse(s); }catch{} }
  return undefined;
}
function apiSample(key){
  const call = async (input, opts={}) => {
    const messages = typeof input==='string' ? [{role:'user', content:input}] : input;
    let r;
    try{
      r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal:opts.signal,
        headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:getModel(), max_tokens:opts.maxTokens||8000, messages})});
    }catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'network', message:String(e)}; }
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      const msg = j?.error?.message || ('HTTP '+r.status);
      const code = r.status===401 || r.status===403 ? 'bad_key' : (r.status===429 || r.status===529) ? 'rate_limited' : ((r.status===404 || r.status===400) && /model/i.test(msg)) ? 'bad_model' : 'upstream_error';
      throw {code, message:msg};
    }
    const text = (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    if(!text.trim()) throw {code:'empty_completion'};
    return {text, truncated: j.stop_reason==='max_tokens'};
  };
  call.json = async (input, opts={}) => {
    const add = '\n\nYour reply is read by a program: reply with only the JSON value, no other text.';
    const {text, truncated} = await call(typeof input==='string' ? input+add : input, opts);
    const v = parseLoose(text);
    if(v===undefined || truncated) throw {code:'invalid_json', text};
    return v;
  };
  return call;
}
function deepMerge(a, b){
  const out = Object.assign({}, a);
  for(const [k,v] of Object.entries(b||{})) out[k] = (v && typeof v==='object' && !Array.isArray(v) && out[k] && typeof out[k]==='object' && !Array.isArray(out[k])) ? deepMerge(out[k], v) : v;
  return out;
}
function localDB(){
  const KEY = 'anamnesis-intakes', listeners = [];
  const read = () => { try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch{ return {}; } };
  const snap = m => ({metadata:{fromCache:false, hasPendingWrites:false}, docs:Object.entries(m).map(([id,d])=>({id, exists:true, data:()=>d}))});
  const write = m => { try{ localStorage.setItem(KEY, JSON.stringify(m)); }catch{ toast('This browser would not save the intake. Storage may be full or blocked.'); } const s=snap(m); listeners.forEach(f=>f(s)); };
  return {
    collection: () => ({ onSnapshot(next){ listeners.push(next); setTimeout(()=>next(snap(read())), 0); return ()=>{ const i=listeners.indexOf(next); if(i>=0) listeners.splice(i,1); }; } }),
    doc: path => { const id = path.split('/')[1]; return {
      async set(d){ const m=read(); m[id]=d; write(m); },
      async update(p){ const m=read(); m[id]=deepMerge(m[id]||{}, p); write(m); },
      async delete(){ const m=read(); delete m[id]; write(m); } }; }
  };
}
function webSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return null;
  let rec = null; const cb = {p:()=>{}, f:()=>{}, s:()=>{}};
  return {
    onPartial(f){ cb.p=f; }, onFinal(f){ cb.f=f; }, onState(f){ cb.s=f; },
    start(){ return new Promise((res, rej)=>{
      rec = new SR(); rec.lang = 'en-CA'; rec.interimResults = true; rec.continuous = true;
      rec.onstart = ()=>{ cb.s({state:'listening'}); res(); };
      rec.onresult = e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) cb.f({text:r[0].transcript.trim()}); else interim += r[0].transcript; } cb.p({text:interim}); };
      rec.onerror = e=>{ if(e.error==='not-allowed' || e.error==='service-not-allowed') rej({code:'not_granted'}); };
      rec.onend = ()=>{ cb.s({state:'idle', reason:'stopped'}); rec=null; };
      try{ rec.start(); }catch{ rej({code:'failed'}); }
    }); },
    async stop(){ if(rec) rec.stop(); }
  };
}
function renderSetup(v){
  const k = getKey();
  v.insertAdjacentHTML('beforeend', `<div><h1>Setup</h1><p class="muted">This copy runs in your browser. Intakes are saved in this browser only. Everything works without a key except letter drafting, which uses Anthropic's API.</p></div>
  <div class="card"><h2>Sample case</h2><p class="small muted">A completed fictional intake, so you can see the summary and letters without filling in the forms.</p><div class="row"><button class="btn" type="button" id="k-seed">Load sample case (Morgan Tse)</button></div></div>
  <form class="card" id="keyForm"><h2>Letter drafting</h2>
    <div class="field"><label for="k-key">Anthropic API key</label><span class="hint">Create one at console.anthropic.com. It is saved only in this browser and sent only to api.anthropic.com.</span>
      <input type="password" id="k-key" autocomplete="off" placeholder="${k ? 'Saved key ending ' + esc(k.slice(-4)) : 'sk-ant-…'}"></div>
    <div class="field"><label for="k-model">Model</label><span class="hint">Any Claude API model id.</span><input type="text" id="k-model" value="${esc(getModel())}"></div>
    <div class="row"><button class="btn primary" type="submit">Save and test</button>${k?'<button class="btn danger" type="button" id="k-clear">Remove key</button>':''}<span class="small" id="k-status">${S.sample?'Letter drafting is on.':'Letter drafting is off.'}</span></div>
    <ul class="small muted"><li>Anyone using this browser can use the saved key. Don't save it on a shared computer.</li><li>Use made-up patients only. Drafting sends the summary and your plan to Anthropic's API.</li></ul>
  </form>`);
  $('#keyForm').onsubmit = async e=>{
    e.preventDefault();
    const key = $('#k-key').value.trim() || getKey(), model = $('#k-model').value.trim();
    const st = $('#k-status');
    if(!key){ st.textContent = 'Paste a key first.'; return; }
    LS.set('anamnesis-model', model || null);
    st.textContent = 'Testing…';
    const s = apiSample(key);
    try{ const r = await s.json('Reply with only {"ok":true}', {maxTokens:50}); if(!r || r.ok!==true) throw {code:'invalid_json'};
      LS.set('anamnesis-key', key); S.sample = s; CAP.sample = Promise.resolve(s); $('#k-key').value=''; st.textContent = 'Saved. Letter drafting is on.'; toast('Letter drafting is on');
    }catch(err){ st.textContent = aiErr(err && err.code) + (err && err.message ? ' (' + err.message + ')' : ''); }
  };
  const c = $('#k-clear'); if(c) c.onclick = ()=>{ LS.set('anamnesis-key', null); S.sample = null; CAP.sample = Promise.resolve(null); render(); toast('Key removed'); };
  $('#k-seed').onclick = async ()=>{
    try{ const r = await fetch('seed/demo-morgan.json'); if(!r.ok) throw 0; const d = await r.json(); saveDoc(d); toast('Sample case added'); go('i-'+d.id); }
    catch{ toast('Could not load the sample case. It is in seed/demo-morgan.json in the repo.'); }
  };
}

/* ---------- Boot ---------- */
async function init(){
  window.addEventListener('hashchange', route);
  route();
  if(STANDALONE){
    const k = getKey(); S.sample = k ? apiSample(k) : null; CAP.sample = Promise.resolve(S.sample);
    S.dict = webSpeech(); setupDictation();
    S.db = localDB(); subscribe(S.db);
    return;
  }
  CAP.sample = use('sample').then(s=>{ S.sample = s; return s; });
  use('dictation').then(d=>{ S.dict = d; setupDictation(); if(d && S.view!=='patient') render(true); });
  const db = await use('db');
  if(!db){ S.offline=true; S.loaded=true; render(); return; }
  S.db = db;
  subscribe(db);
}
function subscribe(db){
  const timer = setTimeout(()=>{ if(!S.loaded){ S.loadErr='taking longer than usual'; render(); } }, 10000);
  db.collection('intakes').onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    const m = {}; snap.docs.forEach(d=>{ m[d.id] = Object.assign(clone(d.data()), {id:d.id}); });
    S.intakes = m; S.loaded = true; if(!snap.metadata.fromCache) S.loadErr=null;
    if(S.view==='patient'){ if(!S.pt) render(); return; }
    render(true);
  }, err=>{ clearTimeout(timer); S.loadErr = err.code; S.loaded = true; render(); });
}
init();
</script>

</body>
</html>
