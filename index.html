<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Anamnesis Intake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinician workspace = sidebar + working column; patient intake = single calm reading column */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#16211F; --muted:#56635F; --line:#D3DCD9;
  --accent:#1E5C57; --accent-ink:#FFFFFF; --accent-soft:#DCEAE7;
  --crit:#B42318; --crit-soft:#FCE8E5; --warn:#8F5500; --warn-soft:#FAEFD8; --ok:#2E6B3B; --ok-soft:#E0EFE3;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201F; --sunk:#1C2927; --ink:#E2EAE7; --muted:#9BABA6; --line:#2B3A37;
  --accent:#6FB6AD; --accent-ink:#0A1312; --accent-soft:#1E3633;
  --crit:#FF8D84; --crit-soft:#3B1D1A; --warn:#F0B562; --warn-soft:#382B15; --ok:#8CC79B; --ok-soft:#1B3021; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201F; --sunk:#1C2927; --ink:#E2EAE7; --muted:#9BABA6; --line:#2B3A37;
  --accent:#6FB6AD; --accent-ink:#0A1312; --accent-soft:#1E3633;
  --crit:#FF8D84; --crit-soft:#3B1D1A; --warn:#F0B562; --warn-soft:#382B15; --ok:#8CC79B; --ok-soft:#1B3021; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-size:.8rem}
.label{font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.82rem}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:650;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* Clinician shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px 18px}
.brand b{font-family:var(--f-doc);font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:.72rem;color:var(--muted)}
.nav{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:550}
.nav:hover{background:var(--sunk)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.side .foot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
.main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));gap:4px;flex-wrap:wrap}
  .brand{padding:0 8px 0 0}
  .side .foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* Intake list */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.list{width:100%;border-collapse:collapse;min-width:620px}
table.list th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:10px 14px;border-bottom:1px solid var(--line)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--sunk)}
table.list tr.urgent td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.empty{padding:36px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr 1fr}}

/* Detail */
.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mod{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center}
.mod i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--line)}
.mod.done i{background:var(--ok)} .mod.active i{background:var(--accent)} .mod.deferred i{background:var(--warn)}
.mod.trig{border-style:dashed}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.timeline li{display:flex;gap:10px;align-items:baseline}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;transform:translateY(-1px)}
.timeline li span:last-child{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:.75rem}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.doctext{white-space:pre-wrap;font-family:var(--f-doc);font-size:.92rem;background:var(--sunk);border-radius:8px;padding:12px;max-height:260px;overflow:auto}

/* Transcript */
.tx{display:flex;flex-direction:column;gap:2px}
.tx .t{display:grid;grid-template-columns:44px 74px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:8px;font-size:.92rem}
.tx .t.pt{background:var(--sunk)}
.tx .t.sys{color:var(--muted);font-style:italic}
.tx .t.flash{outline:2px solid var(--accent)}
.tx .who{font-weight:650;font-size:.78rem;color:var(--muted)}
@media (max-width:600px){.tx .t{grid-template-columns:36px minmax(0,1fr)} .tx .t .who{grid-column:2} .tx .t .body{grid-column:2}}

/* Note */
.notewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){.notewrap{grid-template-columns:1fr}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px;font-family:var(--f-doc);font-size:1rem;line-height:1.6;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.note{padding:18px 16px}}
.note h3{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.note .sec{display:flex;flex-direction:column;gap:6px}
.stmt{display:block}
.stmt .tx-edit{outline:none;border-radius:4px;padding:0 2px}
.stmt .tx-edit:hover{background:var(--sunk)}
.stmt .tx-edit:focus{background:var(--accent-soft)}
.stmt.unv .tx-edit{text-decoration:underline wavy var(--crit);text-underline-offset:4px}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.68rem;line-height:1;padding:3px 5px;margin-left:4px;border-radius:4px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;vertical-align:2px}
.chip.bad{background:var(--crit-soft);color:var(--crit)}
.chip.on{outline:2px solid var(--accent)}
.srcpanel{position:sticky;top:16px}
.srcq{font-family:var(--f-doc);font-size:.95rem;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:3px;box-shadow:0 0 0 1px var(--warn)}
.unres li{margin-bottom:6px}
.letter{font-family:var(--f-doc);font-size:.98rem;line-height:1.6;min-height:340px}

/* Working state */
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}

/* Patient side */
.pt-page{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 0}
.pt-col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:100%}
.pt-top{display:flex;align-items:center;gap:10px}
.pt-top b{font-family:var(--f-doc);font-size:1.15rem;font-weight:600}
.pt-hero h1{font-family:var(--f-doc);font-weight:600;font-size:2rem;letter-spacing:-.01em}
.pt-hero p{font-size:1.05rem;color:var(--muted);margin-top:8px;max-width:60ch}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.feat{grid-template-columns:1fr}}
.feat .card{gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.progress{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.progress div{display:flex;flex-direction:column;gap:5px;font-size:.74rem;color:var(--muted);min-width:0}
.progress div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress div i{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.progress div i b{position:absolute;inset:0;background:var(--accent);transform-origin:left}
.progress div.cur{color:var(--ink);font-weight:600}
@media (max-width:520px){.progress div span{display:none}}
.chat{display:flex;flex-direction:column;gap:12px;flex:1}
.bub{max-width:85%;padding:11px 15px;border-radius:14px;font-size:1rem;line-height:1.5;white-space:pre-wrap}
.bub.ai{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.bub.pt{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px;align-self:flex-end}
.bub.sys{align-self:center;font-size:.82rem;color:var(--muted);background:none;padding:2px}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:56px;max-height:200px;font-size:1rem}
.partial{font-size:.85rem;color:var(--muted);font-style:italic;min-height:1.2em}
.mic.live{border-color:var(--crit);color:var(--crit)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.qopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:560px){.qopts{grid-template-columns:1fr 1fr}}
.qopts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;font-size:.85rem;text-align:left}
.qopts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.crisis{border:2px solid var(--crit);background:var(--crit-soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.crisis h2{color:var(--crit)}
.crisis .num{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.proto{font-size:.82rem;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted)}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Clinical content ---------- */
const MODULES = [
 {id:'story', name:'Your story', kind:'core', cover:'Reason for referral in own words; when it started; what changed; course since; triggers or stressors; effect on work, home and relationships.'},
 {id:'mood', name:'Mood', kind:'core', cover:'Low mood; loss of interest or pleasure (ask separately); energy; appetite or weight; concentration; guilt or worthlessness; slowed or restless; how long; past episodes. Skip items already answered.'},
 {id:'safety', name:'Safety', kind:'core', cover:'Wishing to be dead or not wake up; thoughts of suicide; intent; plan; past attempts; self-harm; thoughts of harming others; access to firearms or saved-up medication; what keeps them going. Required for every patient.'},
 {id:'anxiety', name:'Worry and anxiety', kind:'core', cover:'Excessive worry and what it is about; whether it can be controlled; panic attacks (sudden surges of fear with physical symptoms); avoidance.'},
 {id:'sleep', name:'Sleep', kind:'core', cover:'Falling asleep, staying asleep, early waking; hours slept; snoring, gasping, choking or pauses in breathing; daytime sleepiness and dozing off; nightmares; leg discomfort at night.'},
 {id:'substances', name:'Alcohol and substances', kind:'core', cover:'Alcohol: days per week and drinks per typical day; change over time; cannabis; other drugs; caffeine; nicotine; non-prescribed use of prescription medicines.'},
 {id:'history', name:'Past mental health care', kind:'core', cover:'Past diagnoses; counselling or therapy; psychiatric medicines tried (dose, how long, benefit, side effects); hospital stays.'},
 {id:'medical', name:'Health and medications', kind:'core', cover:'Medical conditions, diagnosed or being investigated; current medicines reconciled against the provided list (taking as prescribed?); allergies; recent changes.'},
 {id:'family', name:'Family history', kind:'core', cover:'Depression, bipolar disorder, psychosis, suicide, and alcohol or drug problems in blood relatives.'},
 {id:'social', name:'Life and work', kind:'core', cover:'Who they live with; supports; job role and hours; work stressors; current work status (working, modified duties, on leave since when); which work tasks are hard now; money or legal stress briefly.'},
 {id:'goals', name:'What matters', kind:'core', cover:'What they hope to get from the appointment; questions for the psychiatrist; anything else the doctor should know.'},
 {id:'mania', name:'Highs and energy', kind:'triggered', cover:'Only if the patient reports times of unusually high, elated or irritable mood or energy. FIRST establish one distinct episode: how many days it lasted, whether it was clearly different from their usual self, whether others noticed. ONLY THEN ask about that episode: less need for sleep while not tired, talking more, racing thoughts, distractibility, more activity or projects, risky spending or behaviour. If no distinct episode is established, mark the module done without asking these.'},
 {id:'psychosis', name:'Unusual experiences', kind:'triggered', cover:'Hearing or seeing things others do not; strongly held beliefs others disagree with; feeling watched, followed or controlled.'},
 {id:'trauma', name:'Difficult experiences', kind:'triggered', cover:'Whether a frightening or harmful event is linked to current symptoms (no details needed); intrusive memories; nightmares; avoidance; feeling on guard. The patient decides how much to share.'},
 {id:'attention', name:'Focus since childhood', kind:'triggered', cover:'Whether focus, restlessness or disorganization began in childhood, before the current low mood; school reports; effect across home, work and school.'},
 {id:'eating', name:'Eating', kind:'triggered', cover:'Changes in eating pattern; loss of control; restriction or compensating behaviours. Gentle, no numbers or targets.'},
 {id:'memory', name:'Memory and thinking', kind:'triggered', cover:'Forgetting recent events or conversations; getting lost; trouble with bills or medicines; changes noticed by family; when it started and how fast.'}
];
const MOD = Object.fromEntries(MODULES.map(m=>[m.id,m]));
const CORE = MODULES.filter(m=>m.kind==='core').map(m=>m.id);
const STEPS = [
 {name:'Your story', mods:['story']},
 {name:'Mood and safety', mods:['mood','safety','anxiety']},
 {name:'Sleep and substances', mods:['sleep','substances']},
 {name:'Health history', mods:['history','medical']},
 {name:'Family and life', mods:['family','social']},
 {name:'What matters', mods:['goals']}
];

const OPTS4 = ['Not at all','Several days','More than half the days','Nearly every day'];
const DIFF = ['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'];
const PHQ9 = {id:'phq9', name:'PHQ-9', stem:'Over the last 2 weeks, how often have you been bothered by any of the following problems?', items:[
 'Little interest or pleasure in doing things',
 'Feeling down, depressed, or hopeless',
 'Trouble falling or staying asleep, or sleeping too much',
 'Feeling tired or having little energy',
 'Poor appetite or overeating',
 'Feeling bad about yourself — or that you are a failure or have let yourself or your family down',
 'Trouble concentrating on things, such as reading the newspaper or watching television',
 'Moving or speaking so slowly that other people could have noticed? Or the opposite — being so fidgety or restless that you have been moving around a lot more than usual',
 'Thoughts that you would be better off dead or of hurting yourself in some way'],
 diff:'If you checked off any problems, how difficult have these problems made it for you to do your work, take care of things at home, or get along with other people?',
 bands:[[0,'Minimal'],[5,'Mild'],[10,'Moderate'],[15,'Moderately severe'],[20,'Severe']], max:27};
const GAD7 = {id:'gad7', name:'GAD-7', stem:'Over the last 2 weeks, how often have you been bothered by the following problems?', items:[
 'Feeling nervous, anxious, or on edge',
 'Not being able to stop or control worrying',
 'Worrying too much about different things',
 'Trouble relaxing',
 'Being so restless that it is hard to sit still',
 'Becoming easily annoyed or irritable',
 'Feeling afraid, as if something awful might happen'],
 diff:'If you checked any problems, how difficult have they made it for you to do your work, take care of things at home, or get along with other people?',
 bands:[[0,'Minimal'],[5,'Mild'],[10,'Moderate'],[15,'Severe']], max:21};
const QS = {phq9:PHQ9, gad7:GAD7};
const QTRIGGER = {mood:'phq9', anxiety:'gad7'};
const band = (q,t)=>{let b=q.bands[0][1]; for(const [min,l] of q.bands) if(t>=min) b=l; return b;};

const RISK_RE = /\b(kill(ing)? myself|suicid\w*|end(ing)? (my life|it all|things)|better off dead|(don'?t|do not) want to (live|be alive|be here|wake up)|not wake up|hurt(ing)? myself|self[- ]?harm\w*|cut(ting)? myself|overdos\w*|take my (own )?life|no reason to live|want to die|wish i (was|were) dead)\b/i;
const RISK_ORDER = ['none','low','moderate','high','imminent'];
const riskRank = l => Math.max(0, RISK_ORDER.indexOf(l||'none'));

const STATUS = {
  sent:['Sent','acc'], in_progress:['In progress','warn'], completed:['Intake complete','ok'], urgent:['Needs review now','crit'],
  note_draft:['Note drafted','acc'], note_approved:['Note approved','ok'], letters_sent:['Letters approved','ok']
};
const RISKPILL = {none:['No risk reported','ok'], low:['Low risk','warn'], moderate:['Moderate risk','warn'], high:['High risk','crit'], imminent:['Imminent risk','crit']};

/* ---------- Prompts ---------- */
const ENGINE_RULES = `You are the intake interviewer for a psychiatric consultation clinic in British Columbia, Canada. You talk with a patient before their first appointment and gather history for their psychiatrist. You never diagnose, never give treatment advice, and never predict outcomes. If asked for advice, say their psychiatrist will go over that at the visit.

How to ask:
- Ask exactly ONE question per turn, in plain words, ideally under 25 words. At most one time frame per question.
- Build on what the patient already said. Never re-ask something already answered (check FACTS and the transcript).
- After a distressing disclosure, acknowledge it briefly (a short phrase) before the next question. No praise, no therapy talk.
- Ask about loss of interest separately from low mood.
- If the latest answer is ambiguous ("yes" to an either/or question, a range, a number outside the scale, "kind of", "I guess"), ask one short clarifying question before moving on.
- Never attribute to the patient anything they did not say. Information from the referral letter or medication list is introduced as such ("Your doctor's letter mentions...").
- If the latest answer contradicts an earlier one or the documents, gently ask which is right, and record the contradiction.
- Red flags get a follow-up straight away: gasping, choking or pauses in breathing during sleep -> ask about snoring and daytime sleepiness; nightmares or a frightening event -> trigger "trauma"; memory complaints or age 65+ -> trigger "memory"; long-standing focus problems from childhood -> trigger "attention"; times of unusually high or irritable mood -> trigger "mania" (gated as its checklist says); hearing or seeing things -> trigger "psychosis"; eating concerns -> trigger "eating".
- Keep each module short, usually 2 to 6 questions. Aim to finish in about 35 to 55 patient answers in total.
- Work through modules in plan order. Insert a triggered module right after the current one.
- Turns marked SYS are app events (a skipped topic, questionnaire scores). Use them, never quote them. A module the patient skipped stays "deferred"; do not return to it.
- When the mood module finishes, the app shows the PHQ-9; when anxiety finishes, the GAD-7. Do not ask those questionnaire items yourself.

Safety:
- The safety module is required for every patient. Ask it right after the mood module, or earlier if the patient mentions hopelessness, death or self-harm. Ask directly and calmly, for example "Have you had thoughts that you'd be better off dead, or of ending your life?" Then, as relevant: intent, plan, past attempts, self-harm, thoughts of harming others, access to firearms or saved-up medication, what keeps them going.
- risk.level scale: "none" (denies all), "low" (passive thoughts only, no intent or plan), "moderate" (active thoughts without intent or plan, or a past attempt), "high" (intent or a plan, or a recent attempt or self-harm), "imminent" (intends to act soon, has means at hand, or is in danger now).
- If the level is "imminent", your reply must tell the patient to call 911 or go to the nearest emergency department now, or call or text 9-8-8 any time, and set done to true.

Return ONLY this JSON object:
{
 "reply": "what you say to the patient next (one question, or the closing message)",
 "currentModule": "module id the reply belongs to",
 "moduleStatus": {"<module id>": "active" | "done"},   // only modules whose status changed
 "trigger": ["<triggered module id>"],                  // triggered modules to add now, else []
 "facts": [{"module":"<id>", "text":"short fact in clinical shorthand, only what the patient said", "turn": <index of the patient turn>}],
 "risk": {"level":"none|low|moderate|high|imminent", "summary":"one sentence"} or null if nothing new about risk,
 "contradictions": [{"text":"what conflicts", "turns":[<i>, <j>]}],
 "done": false   // true only when every core module is done or deferred, or risk is imminent; then reply is a short closing that says the psychiatrist will read this before the visit
}`;

const NOTE_RULES = `You write the draft psychiatric consultation intake note that a psychiatrist will review before seeing the patient. Use only the sources given: the patient interview transcript, the referral letter, the medication list and questionnaire results. Write in concise clinical prose ("Reports...", "Denies..."). Never add facts, never diagnose; diagnostic considerations are phrased as things for the psychiatrist to confirm or rule out.

Every statement MUST cite at least one source:
- {"kind":"turn","turn":<index>,"quote":"exact words copied from that turn, max 20 words"}
- {"kind":"referral","quote":"exact words copied from the referral letter"}
- {"kind":"meds","quote":"exact words copied from the medication list"}
- {"kind":"phq9"} or {"kind":"gad7"} for questionnaire results
Quotes must be copied character for character so they can be checked. Prefer the patient's own turns over the referral when both exist. If the patient and the referral disagree, say so and cite both.
Contradictions and unclear answers go in "unresolved" rather than being smoothed over. Topics the interview never covered or the patient deferred go in "notCovered".

Sections, in this order, with these ids: id (Identifying data), rfr (Reason for referral), hpi (History of presenting illness), ros (Psychiatric review of systems), risk (Safety and risk), pph (Past psychiatric history), subs (Substance use), med (Medical history and medications), fam (Family history), soc (Social and occupational history), scales (Questionnaire scores), goals (Patient goals). Leave a section's statements empty if nothing is known.

Return ONLY this JSON object:
{"sections":[{"id":"hpi","title":"History of presenting illness","statements":[{"text":"...","sources":[...]}]}],
 "considerations":[{"text":"Consider / rule out ...","sources":[...]}],
 "unresolved":[{"text":"...","turns":[<i>]}],
 "notCovered":["..."]}`;

const LETTER_RULES = `You draft three letters from an approved psychiatric consultation note and the psychiatrist's own plan. Use only what the note and plan say. Never invent treatments, doses, diagnoses or follow-up dates. If the plan is empty, write "[Recommendations to be added by the psychiatrist]" where recommendations belong.

1. "gp": consultation letter to the referring physician. Open with a 2-3 sentence case summary, then "Recommendations" as a short numbered list taken from the plan, then a brief assessment summary (history, risk, scores). Clinical register. End with "Sincerely," and the psychiatrist's name.
2. "patient": visit summary written to the patient in plain language (grade 6-8 reading level), warm and direct: what was discussed, the plan, what to do if things get worse (call or text 9-8-8, or 911 in an emergency). No new information.
3. "work": letter to the employer about function at work. Describe current functional limitations and suggested accommodations or timing only as supported by the note and plan. Do NOT include diagnoses, symptoms, medications, history or risk details unless "workConsent" is true, in which case a diagnosis named in the plan may be stated. If the note does not support specific restrictions, say they will follow after assessment.

Return ONLY this JSON object: {"gp":"...","patient":"...","work":"..."} with line breaks as \\n.`;

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,7));
const now = () => Date.now();
const fmt = ms => ms ? new Date(ms).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9']+/g,' ').trim();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, 3600); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch{ toast('Copy is blocked here. Select the text and copy it instead.'); } }
async function use(name){ try{ return window.claude ? await window.claude.use(name) : null; }catch{ return null; } }
const aiErr = code => ({
  not_granted:'Claude access was declined for this page, so the assistant cannot run here.',
  sampling_disabled:'Claude is not available for this account.',
  rate_limited:'Too many requests right now. Wait a moment, then try again.',
  session_expired:'Your session expired. Sign in again, then try again.',
  refused:'The assistant could not answer that. Try rephrasing.',
  invalid_json:'The assistant returned something unreadable. Try again.',
  cancelled:'Stopped.'
}[code] || 'The assistant could not respond. Try again.');

/* ---------- State ---------- */
const S = {db:null, sample:null, dict:null, intakes:{}, loaded:false, offline:false, loadErr:null,
  view:'list', id:null, tab:'overview', pt:null, ptPhase:null, ptBusy:false, ptErr:null, pendingQ:null, pendingReply:null,
  qDraft:null, crisis:false, busy:{}, q:{}, src:null, flashTurn:null, deferRender:false, dictLive:false};

function persist(id, patch){
  const it = S.intakes[id];
  if(it) S.intakes[id] = Object.assign({}, it, clone(patch));
  if(!S.db) return Promise.resolve();
  S.q[id] = (S.q[id] || Promise.resolve())
    .then(()=>S.db.doc('intakes/'+id).update(clone(patch)))
    .catch(e=>toast('Could not save: '+(e && e.code || 'error')));
  return S.q[id];
}
function createIntake(doc){
  S.intakes[doc.id] = clone(doc);
  if(!S.db) return Promise.resolve();
  S.q[doc.id] = S.db.doc('intakes/'+doc.id).set(clone(doc)).catch(e=>toast('Could not save: '+(e && e.code || 'error')));
  return S.q[doc.id];
}
const addEvent = (it, label) => { it.timeline = (it.timeline||[]).concat([{ts:now(), label}]); return it.timeline; };

/* ---------- Routing ---------- */
function route(){
  const h = (location.hash||'').replace(/^#/,'');
  let m;
  if(!h || h==='intakes'){ S.view='list'; S.id=null; }
  else if(h==='new'){ S.view='new'; }
  else if((m=h.match(/^i-([a-z0-9-]+)$/))){ if(S.id!==m[1]){ S.tab='overview'; S.src=null; } S.view='detail'; S.id=m[1]; }
  else if((m=h.match(/^p-([a-z0-9-]+)$/))){ if(S.view!=='patient' || S.id!==m[1]){ S.pt=null; S.ptPhase=null; S.ptErr=null; S.crisis=false; S.pendingQ=null; S.pendingReply=null; } S.view='patient'; S.id=m[1]; }
  else { S.view='list'; }
  render();
  window.scrollTo(0,0);
}
const go = h => { if(location.hash === '#'+h) route(); else location.hash = h; };

/* ---------- Render root ---------- */
function render(fromData){
  const app = $('#app');
  if(S.view==='patient'){ renderPatient(app); return; }
  const active = document.activeElement;
  if(fromData && active && app.contains(active) && (active.isContentEditable || /TEXTAREA|INPUT|SELECT/.test(active.tagName)) && S.view===S.lastView && S.id===S.lastId){ S.deferRender = true; return; }
  S.lastView = S.view; S.lastId = S.id; S.deferRender=false;
  app.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand"><b>Anamnesis</b><span>prototype</span></div>
      <a class="nav ${S.view==='list'||S.view==='detail'?'on':''}" href="#intakes">Intakes</a>
      <a class="nav ${S.view==='new'?'on':''}" href="#new">New intake</a>
      <div class="foot">Fictional patients only. Not for real health information.</div>
    </aside>
    <main class="main"><div class="wrap" id="view"></div></main>
  </div>`;
  const v = $('#view');
  const notes = [];
  if(S.offline) notes.push('Saving is unavailable in this view, so intakes last only until you reload.');
  if(S.loadErr) notes.push('Saved intakes could not be loaded ('+esc(S.loadErr)+').');
  if(!S.loaded && !S.offline) notes.push('Loading saved intakes…');
  if(notes.length) v.insertAdjacentHTML('beforeend', `<div class="banner">${notes.join(' ')}</div>`);
  if(S.view==='list') renderList(v);
  else if(S.view==='new') renderNew(v);
  else if(S.view==='detail') renderDetail(v);
}
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(S.deferRender){ const a=document.activeElement; if(!(a && (a.isContentEditable || /TEXTAREA|INPUT|SELECT/.test(a.tagName)))) render(); } }, 50); });

/* ---------- Intake list ---------- */
function renderList(v){
  const rows = Object.values(S.intakes).sort((a,b)=>{
    const ua = (a.status==='urgent' || riskRank(a.risk?.level)>=3) ? 1 : 0, ub = (b.status==='urgent' || riskRank(b.risk?.level)>=3) ? 1 : 0;
    return ub-ua || (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
  });
  v.insertAdjacentHTML('beforeend', `<div class="row"><div><h1>Intakes</h1><p class="muted">Referrals sent to patients, newest first. Anything flagged for safety sits at the top.</p></div><div class="spacer"></div><a class="btn primary" href="#new">New intake</a></div>`);
  if(!rows.length){
    v.insertAdjacentHTML('beforeend', `<div class="card empty"><h2>No intakes yet</h2><p class="muted">Create an intake from a referral, then open the patient view to run the interview with a made-up patient.</p><a class="btn primary" href="#new">Create the first intake</a></div>`);
    return;
  }
  v.insertAdjacentHTML('beforeend', `<div class="tablewrap"><table class="list"><thead><tr><th>Patient</th><th>Referred by</th><th>Status</th><th>Safety</th><th>Scores</th><th>Updated</th></tr></thead><tbody>${rows.map(it=>{
    const st = STATUS[it.status]||[it.status,''], rk = RISKPILL[it.risk?.level] , urgent = it.status==='urgent' || riskRank(it.risk?.level)>=3;
    const sc = [it.q?.phq9 ? 'PHQ-9 '+it.q.phq9.total : '', it.q?.gad7 ? 'GAD-7 '+it.q.gad7.total : ''].filter(Boolean).join(' · ');
    return `<tr class="click ${urgent?'urgent':''}" data-id="${esc(it.id)}"><td><b>${esc(it.patient?.name)}</b><div class="small muted">${esc([it.patient?.age, it.patient?.pronouns].filter(Boolean).join(' · '))}</div></td>
      <td>${esc(it.referrer||'—')}</td><td><span class="pill ${st[1]}">${esc(st[0])}</span></td>
      <td>${rk && it.risk?.level && (it.risk.level!=='none' || (it.transcript||[]).length) ? `<span class="pill ${rk[1]}">${esc(rk[0])}</span>` : '<span class="muted small">Not assessed</span>'}${(it.risk?.alerts||[]).length?` <span class="small muted">${it.risk.alerts.length} alert${it.risk.alerts.length>1?'s':''}</span>`:''}</td>
      <td class="mono">${esc(sc||'—')}</td><td class="mono">${esc(fmt(it.updatedAt||it.createdAt))}</td></tr>`;
  }).join('')}</tbody></table></div>`);
  $$('tr.click', v).forEach(tr=>tr.onclick=()=>go('i-'+tr.dataset.id));
}

/* ---------- New intake ---------- */
const SAMPLE_REF = {
  name:'Priya Natarajan (test patient)', age:'34', pronouns:'she/her', referrer:'Dr. L. Okafor, family physician', clinician:'Dr. Chow',
  referral:`Dear Dr. Chow,\n\nRe: Priya Natarajan, 34\n\nThank you for seeing Ms. Natarajan, a 34-year-old registered nurse on a surgical ward, with six months of low mood, irritability and poor sleep. She describes dreading shifts since a difficult patient death in the spring and has reduced her hours. She has longstanding trouble with focus that she says predates this. Escitalopram 10 mg started 8 weeks ago with little change. PHQ-9 in clinic 16. She asks about a return-to-full-duties plan.\n\nThank you,\nDr. L. Okafor`,
  meds:`Escitalopram 10 mg PO daily (started 8 weeks ago)\nOral contraceptive (levonorgestrel/ethinyl estradiol) daily\nNo known drug allergies`
};
function renderNew(v){
  v.insertAdjacentHTML('beforeend', `<div class="row"><div><h1>New intake</h1><p class="muted">Add what the referral gives you. The interviewer reads it, so it won't re-ask what's already there.</p></div><div class="spacer"></div><button class="btn" id="fillSample">Fill with a sample referral</button></div>
  <form class="card" id="newForm">
    <div class="fgrid">
      <div class="field" style="grid-column:span 2"><label for="f-name">Patient name</label><input type="text" id="f-name" required placeholder="Use a made-up name"></div>
      <div class="field"><label for="f-age">Age</label><input type="number" id="f-age" min="10" max="110"></div>
      <div class="field"><label for="f-pron">Pronouns</label><input type="text" id="f-pron" placeholder="e.g. she/her"></div>
      <div class="field" style="grid-column:span 2"><label for="f-ref">Referred by</label><input type="text" id="f-ref"></div>
      <div class="field" style="grid-column:span 2"><label for="f-doc">Psychiatrist</label><input type="text" id="f-doc" value="Dr. Chow"></div>
    </div>
    <div class="field"><label for="f-letter">Referral letter</label><span class="hint">Paste the text. Optional.</span><textarea id="f-letter" rows="7"></textarea></div>
    <div class="field"><label for="f-meds">Medication list</label><span class="hint">One per line. Optional.</span><textarea id="f-meds" rows="4"></textarea></div>
    <div class="row"><span class="small muted">Prototype: never enter real patient information.</span><div class="spacer"></div><a class="btn ghost" href="#intakes">Cancel</a><button class="btn primary" type="submit">Create intake</button></div>
  </form>`);
  $('#fillSample').onclick = ()=>{ const s=SAMPLE_REF; $('#f-name').value=s.name; $('#f-age').value=s.age; $('#f-pron').value=s.pronouns; $('#f-ref').value=s.referrer; $('#f-doc').value=s.clinician; $('#f-letter').value=s.referral; $('#f-meds').value=s.meds; };
  $('#newForm').onsubmit = e=>{
    e.preventDefault();
    const name = $('#f-name').value.trim(); if(!name){ toast('Add a patient name.'); return; }
    const id = mkid();
    const doc = {id, createdAt:now(), updatedAt:now(), status:'sent',
      patient:{name, age:$('#f-age').value.trim(), pronouns:$('#f-pron').value.trim()}, referrer:$('#f-ref').value.trim(), clinician:$('#f-doc').value.trim()||'your psychiatrist',
      referralText:$('#f-letter').value.trim(), medsText:$('#f-meds').value.trim(),
      modules:Object.fromEntries(CORE.map(m=>[m,'pending'])), current:'story', transcript:[], facts:[], contradictions:[], q:{}, risk:{level:'none', summary:'', alerts:[]},
      timeline:[{ts:now(), label:'Intake created'}], plan:'', note:null, letters:null};
    createIntake(doc);
    toast('Intake created');
    go('i-'+id);
  };
}

/* ---------- Intake detail ---------- */
function renderDetail(v){
  const it = S.intakes[S.id];
  if(!it){ v.insertAdjacentHTML('beforeend', S.loaded ? `<div class="card empty"><h2>This intake isn't here</h2><p class="muted">It may have been removed.</p><a class="btn" href="#intakes">Back to intakes</a></div>` : `<div class="card"><span class="thinking"><i></i><i></i><i></i></span></div>`); return; }
  const st = STATUS[it.status]||[it.status,''], rk = RISKPILL[it.risk?.level||'none'];
  const assessed = (it.transcript||[]).some(t=>t.m==='safety') || it.q?.phq9;
  v.insertAdjacentHTML('beforeend', `<div class="dhead">
    <div style="min-width:0"><p class="label">Intake · referred by ${esc(it.referrer||'—')}</p><h1>${esc(it.patient?.name)}</h1>
    <p class="muted">${esc([it.patient?.age && it.patient.age+' years', it.patient?.pronouns, 'for '+(it.clinician||'')].filter(Boolean).join(' · '))}</p></div>
    <div class="spacer"></div>
    <div class="row"><span class="pill ${st[1]}">${esc(st[0])}</span>${assessed?`<span class="pill ${rk[1]}">${esc(rk[0])}</span>`:''}<a class="btn" href="#p-${esc(it.id)}">Open patient view</a></div>
  </div>
  <div class="tabs" role="tablist">${[['overview','Overview'],['transcript','Transcript'],['note','Note'],['letters','Letters']].map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}" role="tab">${l}</button>`).join('')}</div>
  <div id="tabbody" class="stack"></div>`);
  $$('.tab', v).forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.src=null; render(); });
  const tb = $('#tabbody');
  ({overview:tabOverview, transcript:tabTranscript, note:tabNote, letters:tabLetters})[S.tab](tb, it);
}

function tabOverview(tb, it){
  const alerts = it.risk?.alerts||[];
  const pTurns = (it.transcript||[]).filter(t=>t.r==='pt').length;
  if(alerts.length || riskRank(it.risk?.level)>=2){
    tb.insertAdjacentHTML('beforeend', `<div class="card ${riskRank(it.risk?.level)>=3||it.status==='urgent'?'crit':''}"><div class="row"><h2>Safety</h2><span class="pill ${RISKPILL[it.risk?.level||'none'][1]}">${esc(RISKPILL[it.risk?.level||'none'][0])}</span>${it.status==='urgent'?`<div class="spacer"></div><button class="btn sm" id="ackUrgent">Mark reviewed</button>`:''}</div>
      ${it.risk?.summary?`<p>${esc(it.risk.summary)}</p>`:''}
      ${alerts.length?`<ul class="timeline">${alerts.map(a=>`<li><span>${esc(a.source)}: ${esc(a.text)}</span><span>${esc(fmt(a.ts))}</span></li>`).join('')}</ul>`:''}
      <p class="small muted">In a production system these alerts would page the on-call clinician with a stated response time. Here they are only shown on this page.</p></div>`);
    const ack = $('#ackUrgent'); if(ack) ack.onclick=()=>{ const tl=addEvent(clone(it),'Safety alert reviewed'); persist(it.id,{status: it.note?'note_draft':(isComplete(it)?'completed':'in_progress'), timeline:tl, updatedAt:now()}); render(); };
  }
  const mods = Object.entries(it.modules||{});
  tb.insertAdjacentHTML('beforeend', `<div class="grid2">
    <div class="stack">
      <div class="card"><div class="row"><h2>Patient interview</h2><div class="spacer"></div><span class="small muted">${pTurns} answer${pTurns===1?'':'s'}</span></div>
        ${pTurns ? '' : `<p class="muted">Not started. In a live product the patient gets a secure link by text or email. In this prototype, open the patient view yourself and answer as a made-up patient.</p>`}
        <div class="mods">${mods.map(([k,s])=>`<span class="mod ${s} ${MOD[k]?.kind==='triggered'?'trig':''}" title="${esc(s)}"><i></i>${esc(MOD[k]?.name||k)}</span>`).join('')}</div>
        <p class="small muted">Green: covered. Amber: patient chose to discuss at the visit. Dashed: added because of something the patient said.</p>
        <div class="row"><a class="btn" href="#p-${esc(it.id)}">${pTurns?'Continue as patient':'Start as patient'}</a>${pTurns?`<button class="btn primary" id="goNote">${it.note?'Open note':'Draft note'}</button>`:''}</div>
      </div>
      ${(it.contradictions||[]).length?`<div class="card"><h2>Contradictions to reconcile</h2><ul class="unres">${it.contradictions.map(c=>`<li>${esc(c.text)} ${(c.turns||[]).map(n=>`<button class="chip" data-turn="${+n}">T${+n}</button>`).join('')}</li>`).join('')}</ul></div>`:''}
      <div class="card"><h2>Referral letter</h2>${it.referralText?`<div class="doctext">${esc(it.referralText)}</div>`:'<p class="muted">None provided.</p>'}</div>
      <div class="card"><h2>Medication list</h2>${it.medsText?`<div class="doctext">${esc(it.medsText)}</div>`:'<p class="muted">None provided.</p>'}</div>
    </div>
    <div class="stack">
      <div class="card"><h2>Questionnaires</h2>${['phq9','gad7'].map(k=>{ const r=it.q?.[k], Q=QS[k];
        return r ? `<div class="score"><b>${r.total}</b><span class="muted">/ ${Q.max}</span><span>${esc(Q.name)} · ${esc(band(Q,r.total))}</span></div>${k==='phq9'?`<p class="small ${r.items[8]>0?'':'muted'}">Item 9: ${esc(OPTS4[r.items[8]])}${r.items[8]>0?' — flagged':''}</p>`:''}${r.diff?`<p class="small muted">Difficulty: ${esc(r.diff)}</p>`:''}`
        : `<p class="muted">${esc(Q.name)} not yet completed.</p>`; }).join('')}
        <p class="small muted">PHQ-9 and GAD-7 developed by Drs. Spitzer, Williams, Kroenke and colleagues; free to reproduce.</p></div>
      <div class="card"><h2>Progress</h2><ul class="timeline">${(it.timeline||[]).map(e=>`<li><span>${esc(e.label)}</span><span>${esc(fmt(e.ts))}</span></li>`).join('')}</ul></div>
    </div>
  </div>`);
  const gn = $('#goNote'); if(gn) gn.onclick=()=>{ S.tab='note'; render(); if(!it.note) draftNote(it.id); };
  $$('.chip[data-turn]', tb).forEach(c=>c.onclick=()=>showTurn(+c.dataset.turn));
}

/* ---------- Note ---------- */
function srcLabel(s){ return s.kind==='turn' ? 'T'+s.turn : s.kind==='referral' ? 'Referral' : s.kind==='meds' ? 'Med list' : s.kind==='phq9' ? 'PHQ-9' : s.kind==='gad7' ? 'GAD-7' : '?'; }
function verifySource(it, s){
  if(!s || !s.kind) return false;
  if(s.kind==='phq9' || s.kind==='gad7') return !!it.q?.[s.kind];
  let text = '';
  if(s.kind==='turn'){ const t=(it.transcript||[])[+s.turn]; if(!t) return false; text=t.t; }
  else if(s.kind==='referral') text = it.referralText;
  else if(s.kind==='meds') text = it.medsText;
  else return false;
  if(!s.quote) return s.kind==='turn';
  const q = norm(s.quote); return q.length>0 && norm(text).includes(q);
}
function checkNote(it, note){
  (note.sections||[]).concat([{statements:note.considerations||[]}]).forEach(sec=>(sec.statements||[]).forEach(st=>{
    st.sources = (st.sources||[]).filter(Boolean).map(s=>({...s, ok:verifySource(it,s)}));
    st.verified = st.sources.some(s=>s.ok);
  }));
  return note;
}
async function draftNote(id){

  const qs = ['phq9','gad7'].map(k=>{ const r=it.q?.[k]; return r ? `${QS[k].name}: total ${r.total}/${QS[k].max} (${band(QS[k],r.total)}); items ${r.items.join(',')}${k==='phq9'?`; item 9 = ${r.items[8]}`:''}; difficulty: ${r.diff||'not answered'}` : `${QS[k].name}: not completed`; }).join('\n');
  const prompt = `${NOTE_RULES}

PATIENT: ${it.patient?.name}, ${it.patient?.age||'age unknown'}, ${it.patient?.pronouns||''}. Referred by ${it.referrer||'unknown'} to ${it.clinician}.
MODULE STATUS: ${Object.entries(it.modules||{}).map(([k,s])=>`${k}=${s}`).join(', ')}
RISK (from interview): ${it.risk?.level||'none'} — ${it.risk?.summary||''}
CONTRADICTIONS FLAGGED DURING INTERVIEW: ${(it.contradictions||[]).map(c=>c.text+' (turns '+(c.turns||[]).join(',')+')').join('; ')||'none'}
QUESTIONNAIRES:
${qs}

REFERRAL LETTER:
<<<
${it.referralText||'(none)'}
>>>

MEDICATION LIST:
<<<
${it.medsText||'(none)'}
>>>

TRANSCRIPT (index, speaker, module):
${tx}`;
  try{
    const note = await S.sample.json(prompt, {modelTier:'default', effort:'medium', cache:false});
    if(!note || !Array.isArray(note.sections)) throw {code:'invalid_json'};
    checkNote(it, note);

function stmtHTML(st, k, si, j, locked){
  return `<span class="stmt ${st.verified?'':'unv'}"><span class="tx-edit" data-k="${k}.${si}.${j}" ${locked?'':'contenteditable="true"'} spellcheck="true">${esc(st.text)}</span>${(st.sources||[]).map((s,x)=>`<button class="chip ${s.ok?'':'bad'}" data-src="${k}.${si}.${j}.${x}" title="${s.ok?'Matched in source':'Not found in source'}">${esc(srcLabel(s))}</button>`).join('')}${st.edited?'<span class="mono muted" title="Edited by you"> ✎</span>':''}</span>`;

function srcPanelHTML(it){
  if(!S.src) return `<h3>Source</h3><p class="muted small">Click a tag after any sentence to see the exact words it came from. Red tags and underlined sentences did not match their source.</p>`;
  const [k,si,j,x] = S.src.split('.').map((v,i)=>i===0?v:+v);
  const n = it.note; const st = (k==='s' ? n.sections[si]?.statements : n.considerations)?.[j]; const s = st?.sources?.[x];
  if(!s) return `<h3>Source</h3><p class="muted">Not found.</p>`;
  let title='', body='';
  if(s.kind==='turn'){ const t=(it.transcript||[])[s.turn]; title=`Turn ${s.turn} · ${t? (t.r==='pt'?'Patient':t.r==='ai'?'Assistant':'App') : 'missing'}`; body=t?t.t:'This turn does not exist.'; }
  else if(s.kind==='referral'){ title='Referral letter'; body=it.referralText||''; }
  else if(s.kind==='meds'){ title='Medication list'; body=it.medsText||''; }
  else { const r=it.q?.[s.kind]; title=QS[s.kind].name; body = r ? QS[s.kind].items.map((q,i)=>`${i+1}. ${q} — ${OPTS4[r.items[i]]}`).join('\n')+`\nTotal ${r.total} (${band(QS[s.kind],r.total)})` : 'Not completed.'; }
  let html = esc(body);
  if(s.quote){ const i = body.toLowerCase().indexOf(String(s.quote).toLowerCase()); if(i>=0) html = esc(body.slice(0,i))+'<mark>'+esc(body.slice(i,i+s.quote.length))+'</mark>'+esc(body.slice(i+s.quote.length)); }
  return `<h3>${esc(title)}</h3>${s.ok?'<span class="pill ok">Matched</span>':'<span class="pill crit">Not found in source</span>'}
    ${s.quote?`<p class="small muted">Cited words: “${esc(s.quote)}”</p>`:''}<div class="srcq">${html}</div>${s.kind==='turn'?`<button class="btn sm" id="openTurn">Open in transcript</button>`:''}`;
}

/* ---------- Dictation ---------- */
function wireDictation(btn, ta, partialEl, onDone){
  if(!btn || !S.dict) return;
  btn.onclick = ()=>{
    if(S.dictLive){ S.dict.stop().catch(()=>{}); return; }
    S.dictTarget = {ta, partialEl, onDone, btn};
    S.dict.start().catch(e=>{ if(e && e.code==='not_granted'){ toast('Microphone access was declined. You can still type.'); btn.hidden=true; } else toast('Dictation could not start.'); });
  };
}
function setupDictation(){
  if(!S.dict) return;
  S.dict.onPartial(({text})=>{ const t=S.dictTarget; if(t?.partialEl) t.partialEl.textContent = text; });
  S.dict.onFinal(({text})=>{ const t=S.dictTarget; if(!t?.ta) return; t.ta.value = (t.ta.value ? t.ta.value.replace(/\s*$/,' ') : '') + text; if(t.partialEl) t.partialEl.textContent=''; t.onDone && t.onDone(); });
  S.dict.onState(({state})=>{ S.dictLive = state==='listening'; const b=S.dictTarget?.btn; if(b && b.isConnected){ b.classList.toggle('live', S.dictLive); b.textContent = S.dictLive ? 'Stop' : (b.dataset.label||'Tap to talk'); } });
}

function isComplete(it){ return CORE.every(m=>['done','deferred'].includes(it.modules?.[m])); }
function renderPatient(app){
  const id = S.id;
  if(!S.pt){
    const src = S.intakes[id];
    if(!src){ app.innerHTML = `<div class="pt-page"><div class="pt-col"><div class="card empty">${S.loaded?`<h2>This intake link isn't valid</h2><p class="muted">Check the link from your clinic.</p><a class="btn" href="#intakes">Back to clinician view</a>`:`<span class="thinking"><i></i><i></i><i></i></span>`}</div></div></div>`; return; }
    S.pt = clone(src);
    if(!(S.pt.timeline||[]).some(e=>e.label==='Link opened by patient')){ S.pt.timeline = addEvent(S.pt,'Link opened by patient'); persist(id,{timeline:S.pt.timeline}); }
    S.ptPhase = (S.pt.transcript||[]).length ? (isComplete(S.pt) || riskRank(S.pt.risk?.level)>=4 ? 'done' : 'chat') : 'welcome';
  }
  const it = S.pt;
  if(S.ptPhase==='welcome') return ptWelcome(app, it);
  if(S.ptPhase==='paused') return ptPaused(app, it);
  if(S.ptPhase==='done') return ptDone(app, it);
  ptChat(app, it);
}

    <div class="card empty"><h2>${imminent?'We have stopped the intake here':'Thank you. Your intake is complete.'}</h2>
    <p class="muted">${esc(it.clinician)} will read your answers before your appointment.${imminent?' Please contact one of the services above now.':''}</p>
    <a class="btn" href="#i-${esc(it.id)}">Go to clinician view (prototype)</a></div>
    <p class="small muted">If things get worse before your visit, call or text 9-8-8, or call 911 in an emergency.</p></div></div>`;
}
function progressHTML(it){
  const curStep = STEPS.findIndex(s=>s.mods.includes(it.current));
  return `<div class="progress" aria-label="Intake progress">${STEPS.map((s,i)=>{
    const f = s.mods.filter(m=>['done','deferred'].includes(it.modules?.[m])).length / s.mods.length;
    return `<div class="${i===curStep?'cur':''}"><i><b style="transform:scaleX(${f})"></b></i><span>${esc(s.name)}</span></div>`; }).join('')}</div>`;
}
function ptChat(app, it){
  const tx = it.transcript||[];
  app.innerHTML = `<div class="pt-page"><div class="pt-col">${ptTop(it)}${progressHTML(it)}
    <div class="chat" id="chat">${tx.map(t=>`<div class="bub ${t.r}">${esc(t.r==='sys' ? sysShow(t.t) : t.t)}</div>`).join('')}
      ${S.crisis?CRISIS_HTML:''}
      ${S.pendingQ?qcardHTML(S.pendingQ):''}
      ${S.ptBusy?`<div class="bub ai"><span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span></div>`:''}
      ${S.ptErr?`<div class="card"><p>${esc(S.ptErr)}</p><div class="row"><button class="btn sm" id="retry">Try again</button></div></div>`:''}
    </div>
    <div class="composer" ${S.pendingQ?'hidden':''}>
      <textarea id="answer" placeholder="Type your answer${S.dict?', or tap to talk':''}" ${S.ptBusy?'disabled':''}></textarea>
      <span class="partial" id="partial"></span>
      <div class="row">${S.dict?`<button class="btn sm mic" id="mic" data-label="Tap to talk">Tap to talk</button>`:''}
        <button class="btn ghost sm" id="skip" ${S.ptBusy?'disabled':''}>Skip this topic</button>
        <button class="btn ghost sm" id="pause">Pause</button>
        <button class="btn ghost sm" id="help">I need help now</button>
        <div class="spacer"></div><button class="btn primary" id="send" ${S.ptBusy?'disabled':''}>Send</button></div>
    </div></div></div>`;
  const chat = $('#chat'); const last = chat.lastElementChild; if(last) last.scrollIntoView({block:'end'});
  const ans = $('#answer');
  if(ans && !S.ptBusy){ try{ const d = sessionStorage.getItem('draft-'+it.id); if(d) ans.value=d; }catch{} ans.focus({preventScroll:true});
    ans.addEventListener('input',()=>{ try{ sessionStorage.setItem('draft-'+it.id, ans.value); }catch{} });
    ans.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#send').click(); } }); }
  $('#send').onclick = ()=>{ const v=ans.value.trim(); if(!v) return; try{ sessionStorage.removeItem('draft-'+it.id); }catch{} sendAnswer(v); };
  $('#skip').onclick = skipTopic;
  $('#pause').onclick = ()=>{ S.ptPhase='paused'; render(); };
  $('#help').onclick = ()=>{ S.crisis=true; addAlert(it,'Patient button','Patient opened crisis help during the intake'); render(); };
  const r=$('#retry'); if(r) r.onclick=()=>{ S.ptErr=null; aiTurn(); };
  wireDictation($('#mic'), ans, $('#partial'));
  if(S.pendingQ) wireQ();
}
const sysShow = t => t.startsWith('PHQ-9') ? 'Questionnaire completed' : t.startsWith('GAD-7') ? 'Questionnaire completed' : t.replace(/^Patient chose to/,'You chose to');

function addAlert(it, source, text){
  it.risk = Object.assign({level:'none', summary:'', alerts:[]}, it.risk);
  it.risk.alerts = (it.risk.alerts||[]).concat([{ts:now(), source, text}]);
  it.status = 'urgent';
  persist(it.id, {risk:it.risk, status:'urgent', updatedAt:now()});
}

function sendAnswer(text){
  const it = S.pt;
  it.transcript.push({r:'pt', t:text, m:it.current, ts:now()});
  if(RISK_RE.test(text)){ S.crisis = true; addAlert(it,'Patient words', `“${text.slice(0,140)}${text.length>140?'…':''}” (T${it.transcript.length-1})`); }
  persist(it.id, {transcript:it.transcript, updatedAt:now()});
  aiTurn();
}
function skipTopic(){
  const it = S.pt; const m = it.current;
  it.transcript.push({r:'sys', t:`Patient chose to discuss "${MOD[m]?.name||m}" at the visit instead.`, m, ts:now()});
  it.modules = Object.assign({}, it.modules, {[m]:'deferred'});
  if(m==='safety') S.crisis = true;
  persist(it.id, {transcript:it.transcript, modules:it.modules, updatedAt:now()});
  aiTurn();
}

function enginePrompt(it, extra){
  const tx = it.transcript.map((t,i)=>`[${i} ${t.r==='pt'?'PT':t.r==='ai'?'AI':'SYS'} ${t.m||''}] ${t.t}`).join('\n');
  const plan = Object.entries(it.modules).map(([k,s])=>`${k} | ${MOD[k]?.name} | ${MOD[k]?.kind} | ${s} | covers: ${MOD[k]?.cover}`).join('\n');
  const off = MODULES.filter(m=>m.kind==='triggered' && !it.modules[m.id]).map(m=>`${m.id} (${m.name}): ${m.cover}`).join('\n');
  const qs = ['phq9','gad7'].map(k=>it.q?.[k] ? `${QS[k].name} done: total ${it.q[k].total}${k==='phq9'?`, item 9 = ${it.q[k].items[8]}`:''}` : `${QS[k].name} not done`).join('; ');
  const pAns = it.transcript.filter(t=>t.r==='pt').length;
  return `${ENGINE_RULES}

PATIENT: ${it.patient?.name}, age ${it.patient?.age||'unknown'}, ${it.patient?.pronouns||'pronouns unknown'}. Psychiatrist: ${it.clinician}. Referred by ${it.referrer||'unknown'}.
REFERRAL LETTER (introduce as "your doctor's letter"):
<<<
${it.referralText||'(none)'}
>>>
MEDICATION LIST PROVIDED:
<<<
${it.medsText||'(none)'}
>>>
MODULE PLAN (id | name | kind | status | must cover), in order:
${plan}
TRIGGERED MODULES AVAILABLE (not yet added):
${off}
CURRENT MODULE: ${it.current}
QUESTIONNAIRES: ${qs}
RISK SO FAR: ${it.risk?.level||'none'}${it.risk?.summary?' — '+it.risk.summary:''}
FACTS RECORDED: ${(it.facts||[]).map(f=>`[${f.module}] ${f.text}`).join('; ')||'none'}
CONTRADICTIONS RECORDED: ${(it.contradictions||[]).map(c=>c.text).join('; ')||'none'}
PATIENT ANSWERS SO FAR: ${pAns}

TRANSCRIPT:
${tx}
${extra||''}
The newest turn is ${it.transcript.length-1}. Decide the next single question and return the JSON.`;
}

async function aiTurn(retried){
  const it = S.pt;
  if(!S.sample){ S.ptErr = 'The live interviewer needs Claude access, which this view does not have. Open the page inside Claude to run it.'; render(); return; }
  S.ptBusy = true; S.ptErr = null; render();
  let res;
  try{
    res = await S.sample.json(enginePrompt(it, retried), {modelTier:'default', effort:'low', cache:false});
  }catch(e){
    S.ptBusy=false; S.ptErr = aiErr(e && e.code); render(); return;
  }
  if(!res || typeof res.reply!=='string' || !res.reply.trim()){ S.ptBusy=false; S.ptErr = aiErr('invalid_json'); render(); return; }

  // apply module changes
  const mods = Object.assign({}, it.modules);
  (Array.isArray(res.trigger)?res.trigger:[]).forEach(t=>{ if(MOD[t] && MOD[t].kind==='triggered' && !mods[t]) mods[t]='pending'; });
  Object.entries(res.moduleStatus||{}).forEach(([k,s])=>{ if(mods[k] && mods[k]!=='deferred' && ['active','done','pending'].includes(s)) mods[k]=s; });
  const cur = MOD[res.currentModule] && mods[res.currentModule] ? res.currentModule : it.current;
  if(mods[cur] && !['done','deferred'].includes(mods[cur])) mods[cur]='active';
  Object.keys(mods).forEach(k=>{ if(k!==cur && mods[k]==='active') mods[k]='done'; });

  // done must respect core coverage
  const imminent = res.risk && res.risk.level==='imminent';
  const coreLeft = CORE.filter(m=>!['done','deferred'].includes(mods[m]));
  if(res.done && !imminent && coreLeft.length && !retried){
    it.modules = mods;
    S.ptBusy=false;
    return aiTurn(`\nAPP CHECK: these required modules are not finished yet: ${coreLeft.join(', ')}. Do not close. Continue with the first of them.`);
  }

  const facts = (it.facts||[]).concat((Array.isArray(res.facts)?res.facts:[]).filter(f=>f && f.text).map(f=>({module:String(f.module||cur), text:String(f.text).slice(0,240), turn:+f.turn||it.transcript.length-1})));
  const contradictions = (it.contradictions||[]).concat((Array.isArray(res.contradictions)?res.contradictions:[]).filter(c=>c && c.text).map(c=>({text:String(c.text), turns:(c.turns||[]).map(Number).filter(n=>!isNaN(n))})));
  let risk = Object.assign({level:'none', summary:'', alerts:[]}, it.risk);
  let status = it.status;
  if(res.risk && RISK_ORDER.includes(res.risk.level)){
    if(riskRank(res.risk.level) >= riskRank(risk.level)){ risk.level = res.risk.level; risk.summary = String(res.risk.summary||''); }
    if(riskRank(res.risk.level)>=3){ risk.alerts = (risk.alerts||[]).concat([{ts:now(), source:'Interview', text:`${res.risk.level} risk — ${res.risk.summary||''}`}]); status='urgent'; S.crisis=true; }
  }

  it.modules = mods; it.current = cur; it.facts = facts; it.contradictions = contradictions; it.risk = risk; it.status = status;
  const reply = {r:'ai', t:res.reply.trim().slice(0,700), m:cur, ts:now()};
  const finished = imminent || (!!res.done && !coreLeft.length);

  // questionnaire gate: show PHQ-9 / GAD-7 when their module just finished
  const dueQ = Object.entries(QTRIGGER).find(([m,q])=>['done'].includes(mods[m]) && !it.q?.[q] && !(it.qSkipped||[]).includes(q));
  if(dueQ && !imminent){
    S.pendingQ = dueQ[1]; S.pendingReply = reply; S.qDraft = {items:Array(QS[dueQ[1]].items.length).fill(null), diff:null};
  } else {
    it.transcript.push(reply);
  }
  if(finished && !S.pendingQ){
    it.timeline = addEvent(it, imminent ? 'Interview stopped for safety' : 'Interview completed');
    if(!imminent && it.status!=='urgent') it.status='completed';
    S.ptPhase='done';
  }
  persist(it.id, {transcript:it.transcript, modules:it.modules, current:it.current, facts:it.facts, contradictions:it.contradictions, risk:it.risk, status:it.status, timeline:it.timeline, updatedAt:now()});
  S.ptBusy=false; render();
}

function qcardHTML(qid){
  const Q = QS[qid], d = S.qDraft;
  return `<div class="qcard" id="qcard"><div><p class="label">${esc(Q.name)} · validated questionnaire</p><h3 style="margin-top:4px">${esc(Q.stem)}</h3></div>
    ${Q.items.map((item,i)=>`<div class="qitem"><span>${i+1}. ${esc(item)}</span><div class="qopts">${OPTS4.map((o,v)=>`<button data-i="${i}" data-v="${v}" class="${d.items[i]===v?'on':''}" aria-pressed="${d.items[i]===v}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
    <div class="qitem"><span>${esc(Q.diff)}</span><div class="qopts">${DIFF.map((o,v)=>`<button data-d="${v}" class="${d.diff===v?'on':''}" aria-pressed="${d.diff===v}">${esc(o)}</button>`).join('')}</div></div>
    <div class="row"><button class="btn ghost sm" id="qskip">I'd rather discuss this in person</button><div class="spacer"></div><span class="small muted" id="qleft"></span><button class="btn primary" id="qsubmit">Submit</button></div></div>`;
}
function wireQ(){
  const qid = S.pendingQ, Q = QS[qid], d = S.qDraft, card = $('#qcard');
  const upd = ()=>{ const left = d.items.filter(v=>v===null).length; $('#qleft').textContent = left ? `${left} left` : ''; $('#qsubmit').disabled = left>0; };
  $$('button[data-i]', card).forEach(b=>b.onclick=()=>{ d.items[+b.dataset.i]=+b.dataset.v; $$(`button[data-i="${b.dataset.i}"]`,card).forEach(x=>{x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b);}); upd(); });
  $$('button[data-d]', card).forEach(b=>b.onclick=()=>{ d.diff=+b.dataset.d; $$('button[data-d]',card).forEach(x=>{x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b);}); });
  upd();
  $('#qsubmit').onclick = ()=>{
    const it = S.pt, total = d.items.reduce((a,b)=>a+b,0), diff = d.diff===null ? '' : DIFF[d.diff];
    it.q = Object.assign({}, it.q, {[qid]:{items:d.items.slice(), total, diff, ts:now()}});
    it.transcript.push({r:'sys', t:`${Q.name} completed: total ${total} (${band(Q,total)}).${qid==='phq9'?` Item 9: ${OPTS4[d.items[8]]} (${d.items[8]}).`:''}${diff?` Difficulty: ${diff}.`:''}`, m:it.current, ts:now()});
    if(qid==='phq9' && d.items[8]>0){ addAlert(it,'PHQ-9 item 9',`Scored ${d.items[8]} (${OPTS4[d.items[8]]})`); }
    const pend = S.pendingReply; S.pendingQ=null; S.pendingReply=null; S.qDraft=null;
    persist(it.id, {q:it.q, transcript:it.transcript, updatedAt:now()});
    // the held reply was written before the scores; ask again with scores in view so safety follow-up uses item 9
    if(qid==='phq9' && d.items[8]>0) aiTurn();
    else { if(pend) it.transcript.push(pend); persist(it.id,{transcript:it.transcript}); render(); }
  };
  $('#qskip').onclick = ()=>{
    const it = S.pt; it.qSkipped = (it.qSkipped||[]).concat([qid]);
    it.transcript.push({r:'sys', t:`Patient chose to discuss the ${Q.name} questionnaire at the visit instead.`, m:it.current, ts:now()});
    const pend = S.pendingReply; S.pendingQ=null; S.pendingReply=null; S.qDraft=null;
    if(pend) it.transcript.push(pend);
    persist(it.id, {qSkipped:it.qSkipped, transcript:it.transcript, updatedAt:now()}); render();
  };
}

/* ---------- Boot ---------- */
async function init(){
  window.addEventListener('hashchange', route);
  route();
  const [db, sample, dict] = await Promise.all([use('db'), use('sample'), use('dictation')]);
  S.sample = sample; S.dict = dict; setupDictation();
  if(!db){ S.offline=true; S.loaded=true; render(); return; }
  S.db = db;
  const timer = setTimeout(()=>{ if(!S.loaded){ S.loadErr='taking longer than usual'; render(); } }, 10000);
  db.collection('intakes').onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    const m = {}; snap.docs.forEach(d=>{ m[d.id] = Object.assign(clone(d.data()), {id:d.id}); });
    S.intakes = m; S.loaded = true; if(!snap.metadata.fromCache) S.loadErr=null;
    if(S.view==='patient'){ if(!S.pt) render(); return; }
    render(true);
  }, err=>{ clearTimeout(timer); S.loadErr = err.code; S.loaded = true; render(); });
}
init();
</script>
